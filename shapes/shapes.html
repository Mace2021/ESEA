<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Shapes - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Learn Shapes</h1>
            <p>Tap a shape to hear its name. Start with shapes children see every day.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        window.EarlyLesson = {
            title: 'Shape Names',
            instructions: 'Look for these shapes in toys, books, windows, and snacks.',
            type: 'explore',
            sections: [{
                title: 'Everyday Shapes',
                items: [
                    { label: 'Circle', image: '../images/circle.png', speak: 'Circle' },
                    { label: 'Square', image: '../images/square.png', speak: 'Square' },
                    { label: 'Triangle', image: '../images/triangle.png', speak: 'Triangle' },
                    { label: 'Rectangle', image: '../images/rectangle.png', speak: 'Rectangle' },
                    { label: 'Star', image: '../images/star.png', speak: 'Star' },
                    { label: 'Heart', image: '../images/heart.png', speak: 'Heart' },
                    { label: 'Oval', image: '../images/oval.png', speak: 'Oval' },
                    { label: 'Diamond', image: '../images/rhombus.png', speak: 'Diamond' }
                ]
            }]
        };
    </script>
    <script src="../early-lesson.js"></script>
</body>
</html>
