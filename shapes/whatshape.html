<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Shape Is This? - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>What Shape Is This?</h1>
            <p>Look at the picture and tap the shape name.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        var shapeOptions = [
            { value: 'circle', label: 'Circle', image: '../images/circle.png' },
            { value: 'square', label: 'Square', image: '../images/square.png' },
            { value: 'triangle', label: 'Triangle', image: '../images/triangle.png' },
            { value: 'rectangle', label: 'Rectangle', image: '../images/rectangle.png' }
        ];
        function shapeRound(item, choices) {
            return {
                prompt: 'What shape is this?',
                speak: 'What shape is this?',
                answer: item.value,
                target: { image: item.image, alt: item.label },
                options: choices
            };
        }
        window.EarlyLesson = {
            title: 'Shape Matching',
            instructions: 'Four choices keeps this lesson calm and easy to scan.',
            type: 'quiz',
            rounds: [
                shapeRound(shapeOptions[0], shapeOptions),
                shapeRound(shapeOptions[1], shapeOptions),
                shapeRound(shapeOptions[2], shapeOptions),
                shapeRound(shapeOptions[3], shapeOptions),
                shapeRound({ value: 'star', label: 'Star', image: '../images/star.png' }, [
                    { value: 'star', label: 'Star', image: '../images/star.png' },
                    { value: 'heart', label: 'Heart', image: '../images/heart.png' },
                    { value: 'oval', label: 'Oval', image: '../images/oval.png' },
                    { value: 'circle', label: 'Circle', image: '../images/circle.png' }
                ])
            ]
        };
    </script>
    <script src="../early-lesson.js"></script>
</body>
</html>
