<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Shape Is This? - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
    <script src="../pip.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>What Shape Is This?</h1>
            <p>Look at the picture and tap the shape name.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        // Age decides the shapes: 3 yrs circle, square, triangle, star; 4 yrs adds rectangle and heart;
        // 5 yrs adds oval and diamond (rhombus); 6 yrs adds pentagon, hexagon and octagon.
        var ALL_SHAPES = {
            circle: 'Circle', square: 'Square', triangle: 'Triangle', star: 'Star', rectangle: 'Rectangle', heart: 'Heart',
            oval: 'Oval', rhombus: 'Diamond', pentagon: 'Pentagon', hexagon: 'Hexagon', octagon: 'Octagon'
        };
        var F = window.ESEAFamily;
        var BASIC = ['circle', 'square', 'triangle', 'star'];
        var IDS = F ? F.byAge({ 3: BASIC, 4: BASIC.concat(['rectangle', 'heart']), 5: BASIC.concat(['rectangle', 'heart', 'oval', 'rhombus']),
            6: BASIC.concat(['rectangle', 'heart', 'oval', 'rhombus', 'pentagon', 'hexagon', 'octagon']) }) : BASIC.concat(['rectangle', 'heart']);
        var shapeOptions = IDS.map(function(id) { return { value: id, label: ALL_SHAPES[id], image: '../images/' + id + '.png' }; });
        function shapeRound(item, choices) {
            return {
                prompt: 'What shape is this?',
                speak: 'What shape is this?',
                answer: item.value,
                target: { image: item.image, alt: item.label },
                options: choices
            };
        }
        window.EarlyLesson = {
            title: 'Shape Matching',
            instructions: 'Look at the shape, then tap its name.',
            type: 'quiz',
            rounds: shapeOptions.map(function(shape) { return shapeRound(shape, shapeOptions); })
        };
    </script>
    <script src="../skill-tracker.js"></script>
    <script src="../early-lesson.js"></script>
</body>
</html>
