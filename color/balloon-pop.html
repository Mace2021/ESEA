<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Pop - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <style>
        .pop-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
        .pop-prompt { text-align: center; font-size: clamp(1.4rem, 6vw, 2rem); font-weight: 900; margin: 6px 0 10px; min-height: 2.6rem; }
        .pop-prompt b { padding: 0 8px; border-radius: 10px; color: #fff; }
        .sky { position: relative; height: clamp(330px, 62vh, 460px); border-radius: 20px; overflow: hidden;
            background: linear-gradient(180deg, #bfe6ff 0%, #e8f6ff 70%, #c9efc2 70%, #b4e3a8 100%); }
        .cloud { position: absolute; background: #fff; border-radius: 40px; opacity: 0.85; height: 34px; }
        .cloud.a { width: 90px; top: 22px; left: 8%; }
        .cloud.b { width: 120px; top: 60px; right: 6%; }
        .balloon { position: absolute; bottom: 12%; width: clamp(68px, 19vw, 96px); border: 0; padding: 0; background: none; cursor: pointer;
            transform: translateY(130%); transition: transform 1s cubic-bezier(0.2, 1.1, 0.4, 1); -webkit-tap-highlight-color: transparent; }
        .balloon.up { transform: translateY(0); }
        .balloon svg { width: 100%; display: block; animation: bob 2.4s ease-in-out infinite alternate; }
        .balloon:nth-child(2n) svg { animation-duration: 2.9s; }
        .balloon .clue { position: absolute; top: 18%; left: 0; right: 0; text-align: center; font-size: clamp(1.6rem, 6vw, 2.2rem); opacity: 0; transform: scale(0.4); transition: all 0.35s ease; }
        .sky.clues .balloon .clue { opacity: 1; transform: scale(1); }
        .balloon.wrong svg { animation: no 0.45s ease-in-out 2; }
        .balloon.glow svg { filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 18px #ffc94d); animation: bob 0.6s ease-in-out infinite alternate; }
        .balloon.popped { pointer-events: none; }
        .balloon.popped svg, .balloon.popped .clue { animation: burst 0.35s ease-out forwards; }
        .confetti { position: absolute; width: 10px; height: 10px; border-radius: 2px; pointer-events: none; animation: fly 0.9s ease-out forwards; }
        @keyframes bob { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-14px) rotate(3deg); } }
        @keyframes no { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
        @keyframes burst { to { transform: scale(1.6); opacity: 0; } }
        @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }
        .done-box { display: none; text-align: center; padding: 18px 8px; }
        .done-box.show { display: block; }
        .done-box .stars { font-size: 2.4rem; letter-spacing: 4px; }
        .done-box h2 { color: var(--navy); font-size: clamp(1.8rem, 8vw, 2.4rem); margin: 6px 0; }
        @media (prefers-reduced-motion: reduce) { .balloon svg { animation: none; } .balloon { transition: none; } }
    </style>
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
    <script src="../pip.js"></script>
    <script src="../skill-tracker.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1 id="heroTitle">Balloon Pop</h1>
            <p id="heroText">Listen for the color, then pop that balloon!</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html" id="homeLink">Home</a></nav>
            <section class="lesson-card-panel">
                <div class="pop-top">
                    <span class="pill" id="roundPill">1 / 8</span>
                    <button type="button" class="hear-again" id="hearAgain" aria-label="Hear it again">&#128264;</button>
                    <span class="pill" id="starPill">&#11088; 0</span>
                </div>
                <div class="pop-prompt" id="prompt" aria-live="polite" data-pip-spot></div>
                <div class="sky" id="sky"><div class="cloud a"></div><div class="cloud b"></div></div>
                <div class="done-box" id="doneBox" aria-live="polite">
                    <div class="stars" id="doneStars" aria-hidden="true"></div>
                    <h2 id="doneTitle"></h2>
                    <p id="doneText"></p>
                    <div class="home-idea" id="doneIdea"></div>
                    <div class="actions" id="doneActions">
                        <button type="button" class="lesson-action" id="againButton"></button>
                        <a class="lesson-action secondary" href="../index.html" id="doneHome"></a>
                    </div>
                </div>
            </section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script src="colors-data.js"></script>
    <script>
        // Color recognition game: hear a color word, pop the matching balloon.
        // After a miss, every balloon shows an everyday object of its color
        // ("Red, like an apple") so the word links to real things; after a
        // second miss the right balloon glows. Colors the child misses come
        // back more often (SkillTracker).
        (function() {
            var L = window.ESEAFamily ? ESEAFamily.lessonLang(['en', 'es', 'fr']) : 'en';
            var T = {
                en: { title: 'Balloon Pop', hero: 'Listen for the color, then pop that balloon!', home: 'Home',
                      pop: 'Pop the {c} balloon!', like: '{C}, like {o}!', thatIs: 'That one is {c}.', find: 'Find {c}, like {o}.',
                      here: 'Here it is! The {c} balloon. Pop it!', praise: ['Pop! {C}!', 'Yes! {C}!', 'You found {c}!', 'Great popping! {C}!'],
                      done: 'All done!', doneText: 'You popped so many balloons!', again: 'Play again', hear: 'Hear it again',
                      doneSay: 'All done! You know so many colors!', idea: 'Grown-ups, try this at home:' },
                es: { title: 'Revienta globos', hero: '¡Escucha el color y revienta ese globo!', home: 'Inicio',
                      pop: '¡Revienta el globo {c}!', like: '¡{C}, como {o}!', thatIs: 'Ese es {c}.', find: 'Busca el {c}, como {o}.',
                      here: '¡Aquí está! El globo {c}. ¡Reviéntalo!', praise: ['¡Pum! ¡{C}!', '¡Sí! ¡{C}!', '¡Encontraste el {c}!', '¡Muy bien! ¡{C}!'],
                      done: '¡Terminaste!', doneText: '¡Reventaste muchísimos globos!', again: 'Jugar otra vez', hear: 'Escuchar otra vez',
                      doneSay: '¡Terminaste! ¡Conoces muchos colores!', idea: 'Adultos, prueben esto en casa:' },
                fr: { title: 'Éclate les ballons', hero: 'Écoute la couleur, puis éclate ce ballon !', home: 'Accueil',
                      pop: 'Éclate le ballon {c} !', like: '{C}, comme {o} !', thatIs: 'Celui-là est {c}.', find: 'Trouve le {c}, comme {o}.',
                      here: 'Le voilà ! Le ballon {c}. Éclate-le !', praise: ['Pop ! {C} !', 'Oui ! {C} !', 'Tu as trouvé le {c} !', 'Bravo ! {C} !'],
                      done: 'C’est fini !', doneText: 'Tu as éclaté plein de ballons !', again: 'Rejouer', hear: 'Réécouter',
                      doneSay: 'C’est fini ! Tu connais plein de couleurs !', idea: 'Adultes, essayez à la maison :' }
            }[L];
            var COLORS = window.ESEA_COLORS;
            var lessonId = 'color/balloon-pop';
            // Age decides the colors and how many balloons float up: 3 yrs four colors and 2-3 balloons,
            // 4 yrs six colors and 3-4, 5 yrs all eight and 3-5, 6 yrs all eight and 4-6.
            var F = window.ESEAFamily;
            var AGE = F ? F.age() : 5;
            var ROUNDS = F ? F.level().rounds : 8;
            var COLOR_IDS = { 3: ['red', 'blue', 'yellow', 'green'], 4: ['red', 'blue', 'yellow', 'green', 'orange', 'purple'] }[AGE];
            if (COLOR_IDS) COLORS = COLORS.filter(function(c) { return COLOR_IDS.indexOf(c.id) !== -1; });
            var BALLOONS = { 3: [2, 3, 3], 4: [3, 4, 4], 5: [3, 4, 5], 6: [4, 5, 6] }[AGE] || [3, 4, 5];
            var sky = document.getElementById('sky');
            var promptEl = document.getElementById('prompt');
            var state;

            document.documentElement.lang = L;
            document.title = T.title + ' - ESEA';
            document.getElementById('heroTitle').textContent = T.title;
            document.getElementById('heroText').textContent = T.hero;
            document.getElementById('homeLink').textContent = T.home;
            document.getElementById('hearAgain').setAttribute('aria-label', T.hear);

            function name(c) { return c.names[L]; }
            function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }
            function fill(text, c) {
                return text.split('{c}').join(name(c)).split('{C}').join(cap(name(c))).split('{o}').join(c.clue[L]);
            }
            function speak(text, onend) {
                if (window.ESEASpeech && ESEASpeech.supported) ESEASpeech.speak(text, { lang: L, onend: onend });
                else if (onend) setTimeout(onend, 900);
            }
            function shuffle(a) {
                a = a.slice();
                for (var i = a.length - 1; i > 0; i -= 1) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
                return a;
            }
            function balloonSvg(hex) {
                return '<svg viewBox="0 0 60 104" aria-hidden="true">' +
                    '<path d="M30 70 C 26 82, 36 90, 30 104" stroke="#6b6b6b" stroke-width="1.5" fill="none"/>' +
                    '<ellipse cx="30" cy="34" rx="27" ry="33" fill="' + hex + '" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>' +
                    '<ellipse cx="20" cy="21" rx="6" ry="10" fill="#fff" opacity="0.4"/>' +
                    '<path d="M25 66 L35 66 L30 73 Z" fill="' + hex + '"/></svg>';
            }

            function start() {
                var picked = window.SkillTracker
                    ? SkillTracker.choose(lessonId, COLORS.map(function(c) { return { answer: c.id, color: c }; }), ROUNDS)
                    : shuffle(COLORS).map(function(c) { return { answer: c.id, color: c }; });
                state = { rounds: picked.map(function(r) { return r.color; }), index: 0, stars: 0, misses: 0, busy: false };
                document.getElementById('doneBox').classList.remove('show');
                sky.hidden = false;
                round();
            }

            function round() {
                var target = state.rounds[state.index];
                var count = Math.min(COLORS.length, BALLOONS[Math.min(2, Math.floor(state.index / Math.max(1, Math.ceil(state.rounds.length / 3))))]);
                var others = shuffle(COLORS.filter(function(c) { return c.id !== target.id; })).slice(0, count - 1);
                var set = shuffle([target].concat(others));
                state.misses = 0;
                state.busy = false;
                sky.classList.remove('clues');
                Array.prototype.slice.call(sky.querySelectorAll('.balloon, .confetti')).forEach(function(n) { n.remove(); });
                document.getElementById('roundPill').textContent = (state.index + 1) + ' / ' + state.rounds.length;
                set.forEach(function(c, i) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'balloon';
                    b.dataset.id = c.id;
                    b.setAttribute('aria-label', name(c));
                    b.style.left = (6 + i * (88 / set.length)) + '%';
                    b.innerHTML = balloonSvg(c.hex) + '<span class="clue" aria-hidden="true">' + c.clue.emoji + '</span>';
                    b.addEventListener('click', tap);
                    sky.appendChild(b);
                    setTimeout(function() { b.classList.add('up'); }, 80 + i * 140);
                });
                promptEl.innerHTML = fill(T.pop, target).replace(name(target), '<b style="background:' + target.hex + '">' + name(target) + '</b>');
                speak(fill(T.pop, target));
            }

            function confetti(x, y, hex) {
                for (var i = 0; i < 14; i += 1) {
                    var c = document.createElement('i');
                    c.className = 'confetti';
                    c.style.left = x + 'px';
                    c.style.top = y + 'px';
                    c.style.background = i % 3 ? hex : '#ffc94d';
                    var angle = (Math.PI * 2 * i) / 14;
                    c.style.setProperty('--dx', Math.round(Math.cos(angle) * 70) + 'px');
                    c.style.setProperty('--dy', Math.round(Math.sin(angle) * 70) + 'px');
                    sky.appendChild(c);
                }
            }

            function tap(e) {
                if (state.busy) return;
                var b = e.currentTarget;
                var target = state.rounds[state.index];
                var tapped = COLORS.filter(function(c) { return c.id === b.dataset.id; })[0];
                if (tapped.id === target.id) {
                    state.busy = true;
                    if (window.ESEAPip) ESEAPip.lessonEvent('correct');
                    var first = state.misses === 0;
                    if (window.SkillTracker) SkillTracker.record(lessonId, target.id, first);
                    state.stars += 1;
                    document.getElementById('starPill').textContent = '⭐ ' + state.stars;
                    b.classList.remove('glow');
                    b.classList.add('popped');
                    var rect = b.getBoundingClientRect(), skyRect = sky.getBoundingClientRect();
                    confetti(rect.left - skyRect.left + rect.width / 2, rect.top - skyRect.top + rect.height * 0.3, target.hex);
                    var praise = T.praise[Math.floor(Math.random() * T.praise.length)];
                    promptEl.textContent = fill(praise, target);
                    speak(fill(praise, target) + ' ' + fill(T.like, target), function() {
                        setTimeout(next, 500);
                    });
                    return;
                }
                state.misses += 1;
                b.classList.remove('wrong');
                void b.offsetWidth;
                b.classList.add('wrong');
                sky.classList.add('clues');
                if (state.misses === 1) {
                    if (window.ESEAPip) ESEAPip.lessonEvent('miss');
                    speak(fill(T.thatIs, tapped) + ' ' + fill(T.find, target));
                } else {
                    var right = sky.querySelector('.balloon[data-id="' + target.id + '"]');
                    if (right) right.classList.add('glow');
                    if (window.ESEAPip) ESEAPip.lessonEvent('reveal');
                    speak(fill(T.here, target));
                }
            }

            function next() {
                state.index += 1;
                if (state.index >= state.rounds.length) return finish();
                round();
            }

            function finish() {
                Array.prototype.slice.call(sky.querySelectorAll('.balloon, .confetti')).forEach(function(n) { n.remove(); });
                sky.hidden = true;
                promptEl.textContent = '';
                var stars = '';
                for (var i = 0; i < state.stars; i += 1) stars += '⭐';
                document.getElementById('doneStars').textContent = stars;
                document.getElementById('doneTitle').textContent = T.done;
                document.getElementById('doneText').textContent = T.doneText;
                var idea = window.ESEAFamily ? ESEAFamily.homeIdea(lessonId) : '';
                document.getElementById('doneIdea').innerHTML = idea ? '<strong>' + T.idea + '</strong> ' + idea : '';
                document.getElementById('doneIdea').hidden = !idea;
                document.getElementById('againButton').textContent = T.again;
                document.getElementById('doneHome').textContent = T.home;
                document.getElementById('doneBox').classList.add('show');
                if (window.ESEAFamily && !document.getElementById('planBack')) {
                    var back = ESEAFamily.finished(lessonId);
                    if (back) { back.id = 'planBack'; document.getElementById('doneActions').insertBefore(back, document.getElementById('againButton')); }
                }
                if (window.ESEAPip) ESEAPip.lessonEvent('done');
                speak(T.doneSay);
            }

            document.getElementById('hearAgain').addEventListener('click', function() {
                if (state && state.index < state.rounds.length) speak(fill(T.pop, state.rounds[state.index]));
            });
            document.getElementById('againButton').addEventListener('click', start);
            start();
        })();
    </script>
</body>
</html>
