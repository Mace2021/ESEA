<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Match - ESEA</title>
    <link rel="stylesheet" href="../responsive.css">
    <link rel="stylesheet" href="puzzle-lesson.css">
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
    <script src="../pip.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <header role="banner">
            <div class="logo-container">
                <img src="../images/ESEA.png" alt="ESEA logo">
                <div>
                    <h1>Number Match</h1>
                    <p>Count small groups and choose the number.</p>
                </div>
            </div>
        </header>
        <main class="container page-content">
            <a href="puzzles.html" class="back-button">Back to Puzzles</a>
            <section class="lesson-panel" aria-labelledby="lessonTitle">
                <div class="lesson-top">
                    <div class="lesson-copy"><h2 id="lessonTitle">Number Match</h2><p id="lessonGoal">Count small groups and choose the matching number.</p></div>
                    <div class="progress-wrap" aria-label="Lesson progress"><div class="progress-meta"><span class="pill" id="roundText">1 of 5</span><span class="pill" id="scoreText">0 correct</span></div><div class="progress-track" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div></div>
                </div>
                <div class="activity-area" id="activityArea"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div>
                <div class="actions"><button type="button" class="primary-action" id="nextButton">Next</button><button type="button" class="secondary-action" id="restartButton">Restart</button></div>
                <div class="complete-box" id="completeBox" aria-live="polite"><h3>Great work!</h3><p id="completeText">You finished the lesson.</p></div>
            </section>
        </main>
        <footer role="contentinfo"><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script src="../app.js"></script>
    <script>
        function dotCloud(count) {
            var dots = '';
            for (var i = 0; i < count; i += 1) dots += '<span class="dot"></span>';
            return '<div class="number-target"><div class="dot-cloud" role="img" aria-label="' + count + ' dots">' + dots + '</div></div>';
        }
        // Age decides the numbers: 3 yrs 1-3, 4 yrs 1-5, 5 yrs 1-8, 6 yrs 3-10.
        var F = window.ESEAFamily;
        var COUNTS = F ? F.byAge({ 3: [1, 3], 4: [1, 5], 5: [1, 8], 6: [3, 10] }) : [1, 5];
        function nearNumbers(n, lo, hi) {
            var nums = [n];
            [-1, 1, -2, 2, 3, -3, 4, -4].forEach(function(d) {
                var c = n + d;
                if (nums.length < 4 && c >= Math.max(1, lo) && c <= hi) nums.push(c);
            });
            return nums.sort(function(a, b) { return a - b; });
        }
        function seq(lo, hi) { var out = []; for (var i = lo; i <= hi; i += 1) out.push(i); return out; }
        function numberOptions(count) {
            return nearNumbers(count, COUNTS[0], COUNTS[1]).map(function(number) {
                return { value: String(number), label: String(number), art: '<span class="choice-art">' + number + '</span>' };
            });
        }
        window.PuzzleLessonConfig = {
            id: 'number-match',
            title: 'Number Match',
            goal: 'Count small groups and choose the matching number.',
            type: 'choice',
            rounds: seq(COUNTS[0], COUNTS[1]).map(function(count) {
                return { prompt: 'How many dots?', answer: String(count), target: dotCloud(count), options: numberOptions(count) };
            })
        };
    </script>
    <script src="../skill-tracker.js"></script>
    <script src="puzzle-lesson.js"></script>
</body>
</html>
