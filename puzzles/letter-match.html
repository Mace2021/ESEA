<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Match - ESEA</title>
    <link rel="stylesheet" href="../responsive.css">
    <link rel="stylesheet" href="puzzle-lesson.css">
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
    <script src="../pip.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <header role="banner"><div class="logo-container"><img src="../images/ESEA.png" alt="ESEA logo"><div><h1>Letter Match</h1><p>Match big letters with little letters.</p></div></div></header>
        <main class="container page-content">
            <a href="puzzles.html" class="back-button">Back to Puzzles</a>
            <section class="lesson-panel" aria-labelledby="lessonTitle">
                <div class="lesson-top"><div class="lesson-copy"><h2 id="lessonTitle">Letter Match</h2><p id="lessonGoal">Match big letters with their little letters.</p></div><div class="progress-wrap" aria-label="Lesson progress"><div class="progress-meta"><span class="pill" id="roundText">1 of 5</span><span class="pill" id="scoreText">0 correct</span></div><div class="progress-track" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div></div></div>
                <div class="activity-area" id="activityArea"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div>
                <div class="actions"><button type="button" class="primary-action" id="nextButton">Next</button><button type="button" class="secondary-action" id="restartButton">Restart</button></div>
                <div class="complete-box" id="completeBox" aria-live="polite"><h3>Great work!</h3><p id="completeText">You finished the lesson.</p></div>
            </section>
        </main>
        <footer role="contentinfo"><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script src="../app.js"></script>
    <script>
        function letterRound(big, small, options) {
            return {
                prompt: 'Match ' + big + ' with the little letter.',
                speak: 'Find the little letter that matches big [' + big + '].',
                answer: small,
                target: '<div class="letter-target" aria-label="big letter ' + big + '">' + big + '</div>',
                options: options.map(function(letter) {
                    return { value: letter, label: letter, art: '<span class="choice-art">' + letter + '</span>' };
                })
            };
        }
        // Letters that are easy to mix up make the better wrong answers for older children.
        var LOOKALIKE = { b: 'dpq', d: 'bpq', p: 'qbd', q: 'pdb', m: 'nw', n: 'mu', u: 'nv', w: 'mv', c: 'oe', o: 'ca', e: 'ca',
            a: 'oe', f: 't', t: 'f', i: 'lj', l: 'i', j: 'i', g: 'q', h: 'n', k: 'x', r: 'n', s: 'z', z: 's', v: 'wy', y: 'v', x: 'k' };
        function confusers(letter, pool, count) {
            var lower = letter.toLowerCase();
            var picks = (LOOKALIKE[lower] || '').split('').filter(function(c) { return c && c !== lower; })
                .map(function(c) { return letter === lower ? c : c.toUpperCase(); });
            var rest = pool.filter(function(c) { return c !== letter && picks.indexOf(c) === -1; });
            for (var i = rest.length - 1; i > 0; i -= 1) { var j = Math.floor(Math.random() * (i + 1)); var t = rest[i]; rest[i] = rest[j]; rest[j] = t; }
            return picks.concat(rest).slice(0, count);
        }
        // Age decides the letters: 3 yrs A-E, 4 yrs A-H, 5 yrs A-M, 6 yrs A-Z (with look-alike little letters).
        var F = window.ESEAFamily;
        var ALL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        var BIG = ALL.slice(0, F ? F.byAge({ 3: 5, 4: 8, 5: 13, 6: 26 }) : 5);
        var SMALL_POOL = ALL.map(function(c) { return c.toLowerCase(); });
        window.PuzzleLessonConfig = {
            id: 'letter-match',
            title: 'Letter Match',
            goal: 'Match big letters with their little letters.',
            type: 'choice',
            rounds: BIG.map(function(big) {
                var small = big.toLowerCase();
                return letterRound(big, small, [small].concat(confusers(small, SMALL_POOL, 3)));
            })
        };
    </script>
    <script src="../skill-tracker.js"></script>
    <script src="puzzle-lesson.js"></script>
</body>
</html>
