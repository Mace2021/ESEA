<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Match - ESEA</title>
    <link rel="stylesheet" href="../responsive.css">
    <link rel="stylesheet" href="puzzle-lesson.css">
</head>
<body>
    <div class="page-wrapper">
        <header role="banner"><div class="logo-container"><img src="../images/ESEA.png" alt="ESEA logo"><div><h1>Letter Match</h1><p>Match big letters with little letters.</p></div></div></header>
        <main class="container page-content">
            <a href="puzzles.html" class="back-button">Back to Puzzles</a>
            <section class="lesson-panel" aria-labelledby="lessonTitle">
                <div class="lesson-top"><div class="lesson-copy"><h2 id="lessonTitle">Letter Match</h2><p id="lessonGoal">Match big letters with their little letters.</p></div><div class="progress-wrap" aria-label="Lesson progress"><div class="progress-meta"><span class="pill" id="roundText">1 of 5</span><span class="pill" id="scoreText">0 correct</span></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div></div></div>
                <div class="activity-area" id="activityArea"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div>
                <div class="actions"><button type="button" class="primary-action" id="nextButton">Next</button><button type="button" class="secondary-action" id="restartButton">Restart</button></div>
                <div class="complete-box" id="completeBox" aria-live="polite"><h3>Great work!</h3><p id="completeText">You finished the lesson.</p></div>
            </section>
        </main>
        <footer role="contentinfo"><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script src="../app.js"></script>
    <script>
        function letterRound(big, small, options) {
            return {
                prompt: 'Match ' + big + ' with the little letter.',
                answer: small,
                target: '<div class="letter-target" aria-label="big letter ' + big + '">' + big + '</div>',
                options: options.map(function(letter) {
                    return { value: letter, label: letter, art: '<span class="choice-art">' + letter + '</span>' };
                })
            };
        }
        window.PuzzleLessonConfig = {
            id: 'letter-match',
            title: 'Letter Match',
            goal: 'Match big letters with their little letters.',
            type: 'choice',
            rounds: [
                letterRound('A', 'a', ['a', 'b', 'c', 'd']),
                letterRound('B', 'b', ['d', 'b', 'a', 'e']),
                letterRound('C', 'c', ['c', 'o', 's', 'a']),
                letterRound('D', 'd', ['b', 'p', 'd', 'q']),
                letterRound('E', 'e', ['c', 'e', 'f', 'a'])
            ]
        };
    </script>
    <script src="puzzle-lesson.js"></script>
</body>
</html>
