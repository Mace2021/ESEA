<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Match - ESEA</title>
    <link rel="stylesheet" href="../responsive.css">
    <link rel="stylesheet" href="puzzle-lesson.css">
</head>
<body>
    <div class="page-wrapper">
        <header role="banner">
            <div class="logo-container">
                <img src="../images/ESEA.png" alt="ESEA logo">
                <div>
                    <h1>Shape Match</h1>
                    <p>Match shape names to pictures.</p>
                </div>
            </div>
        </header>
        <main class="container page-content">
            <a href="puzzles.html" class="back-button">Back to Puzzles</a>
            <section class="lesson-panel" aria-labelledby="lessonTitle">
                <div class="lesson-top">
                    <div class="lesson-copy">
                        <h2 id="lessonTitle">Shape Match</h2>
                        <p id="lessonGoal">Match everyday shape names to visual shapes.</p>
                    </div>
                    <div class="progress-wrap" aria-label="Lesson progress">
                        <div class="progress-meta">
                            <span class="pill" id="roundText">1 of 4</span>
                            <span class="pill" id="scoreText">0 correct</span>
                        </div>
                        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>
                <div class="activity-area" id="activityArea"></div>
                <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
                <div class="actions">
                    <button type="button" class="primary-action" id="nextButton">Next</button>
                    <button type="button" class="secondary-action" id="restartButton">Restart</button>
                </div>
                <div class="complete-box" id="completeBox" aria-live="polite">
                    <h3>Great work!</h3>
                    <p id="completeText">You finished the lesson.</p>
                </div>
            </section>
        </main>
        <footer role="contentinfo">
            <p>ESEA - Early Start Education App</p>
        </footer>
    </div>
    <script src="../app.js"></script>
    <script>
        var shapeOptions = [
            { value: 'circle', label: 'Circle', art: '<span class="shape-token shape-circle" aria-hidden="true"></span>' },
            { value: 'square', label: 'Square', art: '<span class="shape-token shape-square" aria-hidden="true"></span>' },
            { value: 'triangle', label: 'Triangle', art: '<span class="shape-token shape-triangle" aria-hidden="true"></span>' },
            { value: 'star', label: 'Star', art: '<span class="shape-star" aria-hidden="true">&#9733;</span>' }
        ];
        window.PuzzleLessonConfig = {
            id: 'shape-match',
            title: 'Shape Match',
            goal: 'Match everyday shape names to visual shapes.',
            type: 'choice',
            rounds: [
                { prompt: 'Find the circle.', answer: 'circle', target: '<span class="shape-token shape-circle" aria-hidden="true"></span><span class="sr-only">circle</span>', options: shapeOptions },
                { prompt: 'Find the square.', answer: 'square', target: '<span class="shape-token shape-square" aria-hidden="true"></span><span class="sr-only">square</span>', options: shapeOptions },
                { prompt: 'Find the triangle.', answer: 'triangle', target: '<span class="shape-token shape-triangle" aria-hidden="true"></span><span class="sr-only">triangle</span>', options: shapeOptions },
                { prompt: 'Find the star.', answer: 'star', target: '<span class="shape-star" aria-hidden="true">&#9733;</span><span class="sr-only">star</span>', options: shapeOptions }
            ]
        };
    </script>
    <script src="puzzle-lesson.js"></script>
</body>
</html>
