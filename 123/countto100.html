<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hear Numbers 1-100 - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Hear Numbers 1-100</h1>
            <p>Tap a number to hear it. Start slow, repeat often, and count all the way from one to one hundred.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        window.EarlyLesson = {
            title: 'Hear Numbers 1-100',
            instructions: 'Tap each number. Say it out loud with the voice.',
            type: 'explore',
            sections: [{
                title: 'Numbers 1 to 100',
                compact: true,
                items: Array.from({ length: 100 }, function(_, index) {
                    var number = index + 1;
                    return { label: String(number), symbol: String(number), speak: String(number) };
                })
            }]
        };
    </script>
    <script src="../early-lesson.js"></script>
</body>
</html>
