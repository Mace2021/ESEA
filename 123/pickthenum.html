<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick the Number - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Pick the Number</h1>
            <p>Listen, look, and tap the matching number.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        function numberOption(number) {
            return { value: String(number), label: String(number), symbol: String(number) };
        }
        function makeOptions(number) {
            var options = [number];
            var offsets = [-1, 1, -2, 2, 10, -10, 3, -3, 20, -20];
            for (var i = 0; i < offsets.length && options.length < 4; i++) {
                var candidate = number + offsets[i];
                if (candidate >= 1 && candidate <= 100 && options.indexOf(candidate) === -1) {
                    options.push(candidate);
                }
            }
            return options.sort(function(a, b) { return a - b; }).map(numberOption);
        }
        function numberRound(number) {
            return {
                prompt: 'Tap number ' + number + '.',
                speak: 'Which number is ' + number + '?',
                answer: String(number),
                target: { text: String(number) },
                options: makeOptions(number)
            };
        }
        window.EarlyLesson = {
            title: 'Find the Number 1 to 100',
            instructions: 'Choose the matching number from a few choices and practice 1-100.',
            type: 'quiz',
            rounds: Array.from({ length: 100 }, function(_, index) {
                return numberRound(index + 1);
            })
        };
    </script>
    <script src="../early-lesson.js"></script>
</body>
</html>
