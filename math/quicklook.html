<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Look - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
    <script src="../pip.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Quick Look</h1>
            <p>Look fast! How many dots did you see?</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        var L = window.ESEAFamily ? ESEAFamily.lessonLang(['en', 'es', 'fr']) : 'en';

        var T = {
            en: { title: 'Quick Look', hero: 'Look fast! How many dots did you see?', prompt: 'How many dots?',
                  speak: 'Look quickly! How many dots?',
                  intro: 'The dots hide after two seconds. Try to see how many without counting one by one.' },
            es: { title: 'Mirada rápida', hero: '¡Mira rápido! ¿Cuántos puntos viste?', prompt: '¿Cuántos puntos?',
                  speak: '¡Mira rápido! ¿Cuántos puntos hay?',
                  intro: 'Los puntos se esconden después de dos segundos. Intenta ver cuántos hay sin contarlos uno por uno.' },
            fr: { title: 'Coup d’œil', hero: 'Regarde vite ! Combien de points as-tu vus ?', prompt: 'Combien de points ?',
                  speak: 'Regarde vite ! Combien de points ?',
                  intro: 'Les points se cachent après deux secondes. Essaie de voir combien il y en a sans les compter un par un.' }
        }[L];
        // Age decides the numbers and how long the dots stay: 3 yrs 1-3 for 3 s, up to 6 yrs 2-8 for 1.3 s.
        var F = window.ESEAFamily;
        var COUNTS = F ? F.byAge({ 3: [1, 3], 4: [1, 5], 5: [1, 6], 6: [2, 8] }) : [1, 5];
        function nearNumbers(n, lo, hi) {
            var nums = [n];
            [-1, 1, -2, 2, 3, -3, 4, -4].forEach(function(d) {
                var c = n + d;
                if (nums.length < 4 && c >= Math.max(1, lo) && c <= hi) nums.push(c);
            });
            return nums.sort(function(a, b) { return a - b; });
        }
        function seq(lo, hi) { var out = []; for (var i = lo; i <= hi; i += 1) out.push(i); return out; }
        var FLASH = F ? F.byAge({ 3: 3000, 4: 2000, 5: 1600, 6: 1300 }) : 2000;
        function options(n) {
            return nearNumbers(n, COUNTS[0], COUNTS[1]).map(function(x) { return { value: String(x), label: String(x), symbol: String(x) }; });
        }
        window.EarlyLesson = {
            lang: L,
            hero: { title: T.title, text: T.hero },
            title: T.title,
            instructions: T.intro,
            type: 'quiz',
            rounds: seq(COUNTS[0], COUNTS[1]).map(function(n) {
                return { prompt: T.prompt, speak: T.speak, answer: String(n), target: { dots: n }, options: options(n), flashMs: FLASH };
            })
        };
    </script>
    <script src="../skill-tracker.js"></script>
    <script src="../early-lesson.js"></script>
</body>
</html>
