<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Comes Next? - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
    <script src="../pip.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>What Comes Next?</h1>
            <p>Which number comes next?</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        var L = window.ESEAFamily ? ESEAFamily.lessonLang(['en', 'es', 'fr']) : 'en';

        var T = {
            en: { title: 'What Comes Next?', hero: 'Which number comes next?', prompt: 'What comes next?',
                  ask: 'What comes next?', intro: 'Say the numbers out loud. Which number comes after them?', hint: 'Let’s count:', back: 'Counting back!' },
            es: { title: '¿Qué sigue?', hero: '¿Qué número sigue?', prompt: '¿Qué número sigue?',
                  ask: '¿Qué número sigue?', intro: 'Di los números en voz alta. ¿Qué número viene después?', hint: 'Vamos a contar:', back: '¡Contamos hacia atrás!' },
            fr: { title: 'Et après ?', hero: 'Quel nombre vient après ?', prompt: 'Quel nombre vient après ?',
                  ask: 'Quel nombre vient après ?', intro: 'Dis les nombres à voix haute. Quel nombre vient ensuite ?', hint: 'Comptons :', back: 'On compte à rebours !' }
        }[L];
        // Age decides how far the numbers go: 3 yrs up to 5, 4 yrs up to 10, 5 yrs up to 20,
        // 6 yrs up to 20 with some rounds counting back (9, 8, 7, ...).
        var F = window.ESEAFamily;
        var TOP = F ? F.byAge({ 3: 5, 4: 10, 5: 20, 6: 20 }) : 10;
        // Each entry is [first number, how many numbers are shown]; age 3 also gets short "1, 2, ?" patterns.
        var STARTS = F ? F.byAge({ 3: [[1, 2], [2, 2], [3, 2], [1, 3], [2, 3]], 4: [[1, 3], [2, 3], [3, 3], [4, 3], [5, 3], [6, 3], [7, 3]],
            5: [[3, 3], [5, 3], [7, 3], [9, 3], [11, 3], [13, 3], [15, 3], [17, 3]], 6: [[6, 3], [9, 3], [12, 3], [15, 3], [17, 3]] })
            : [[1, 3], [2, 3], [3, 3], [4, 3], [5, 3], [6, 3], [7, 3]];
        var BACK = F ? F.byAge({ 3: [], 4: [], 5: [], 6: [10, 13, 16, 20, 8] }) : [];
        function round(start, down, len) {
            var step = down ? -1 : 1;
            len = len || 3;
            var seq = [];
            for (var k = 0; k < len; k += 1) seq.push(start + k * step);
            var answer = start + len * step;
            var nums = [answer];
            [answer + step, answer - step, answer + 2 * step, answer - 2 * step, answer + 3 * step, answer - 3 * step, answer + 4 * step].forEach(function(c) {
                if (nums.length < 4 && c >= 1 && c <= TOP && nums.indexOf(c) === -1) nums.push(c);
            });
            return {
                key: (down ? 'back ' : 'after ') + seq.join(' '),
                prompt: down ? T.back + ' ' + T.prompt : T.prompt,
                speak: (down ? T.back + ' ' : '') + seq.join(', ') + '. ' + T.ask,
                hint: T.hint + ' ' + seq.join(', ') + '...',
                answer: String(answer),
                target: { html: '<span class="seq">' + seq.join(' ') + ' <span class="gap">?</span></span>' },
                options: nums.sort(function(a, b) { return a - b; }).map(function(x) {
                    return { value: String(x), label: String(x), symbol: String(x) };
                })
            };
        }
        window.EarlyLesson = {
            lang: L,
            hero: { title: T.title, text: T.hero },
            title: T.title,
            instructions: T.intro,
            type: 'quiz',
            rounds: STARTS.map(function(s) { return round(s[0], false, s[1]); }).concat(BACK.map(function(s) { return round(s, true, 3); }))
        };
    </script>
    <script src="../skill-tracker.js"></script>
    <script src="../early-lesson.js"></script>
</body>
</html>
