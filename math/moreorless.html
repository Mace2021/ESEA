<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More or Less - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
    <script src="../pip.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>More or Less</h1>
            <p>Which group has more?</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        var L = window.ESEAFamily ? ESEAFamily.lessonLang(['en', 'es', 'fr']) : 'en';

        var T = {
            en: { title: 'More or Less', hero: 'Which group has more?', prompt: 'Which has more?',
                  speak: 'Which group has more dots?', intro: 'Look at both groups. Tap the group with more.',
                  hint: 'Count each group. Which one has more?', revealText: 'This one has more!',
                  revealSay: 'This group has more. Tap it.', alt: 'group of {n} dots',
                  fPrompt: 'Which has fewer?', fSpeak: 'Which group has fewer dots?', fHint: 'Count each group. Which one has fewer?', fRevealText: 'This one has fewer!', fRevealSay: 'This group has fewer. Tap it.' },
            es: { title: 'Más o menos', hero: '¿Qué grupo tiene más?', prompt: '¿Cuál tiene más?',
                  speak: '¿Qué grupo tiene más puntos?', intro: 'Mira los dos grupos. Toca el grupo que tiene más.',
                  hint: 'Cuenta cada grupo. ¿Cuál tiene más?', revealText: '¡Este tiene más!',
                  revealSay: 'Este grupo tiene más. Tócalo.', alt: 'grupo de {n} puntos',
                  fPrompt: '¿Cuál tiene menos?', fSpeak: '¿Qué grupo tiene menos puntos?', fHint: 'Cuenta cada grupo. ¿Cuál tiene menos?', fRevealText: '¡Este tiene menos!', fRevealSay: 'Este grupo tiene menos. Tócalo.' },
            fr: { title: 'Plus ou moins', hero: 'Quel groupe en a le plus ?', prompt: 'Lequel en a le plus ?',
                  speak: 'Quel groupe a le plus de points ?', intro: 'Regarde les deux groupes. Touche celui qui en a le plus.',
                  hint: 'Compte chaque groupe. Lequel en a le plus ?', revealText: 'Celui-ci en a plus !',
                  revealSay: 'Ce groupe en a plus. Touche-le.', alt: 'groupe de {n} points',
                  fPrompt: 'Lequel en a le moins ?', fSpeak: 'Quel groupe a le moins de points ?', fHint: 'Compte chaque groupe. Lequel en a le moins ?', fRevealText: 'Celui-ci en a moins !', fRevealSay: 'Ce groupe en a moins. Touche-le.' }
        }[L];
        // Age decides the groups: 3 yrs small numbers with big differences; 4 yrs up to 7;
        // 5 yrs up to 8 with closer numbers; 6 yrs up to 10 and half the questions ask "fewer".
        var F = window.ESEAFamily;
        var pairs = (F ? F.byAge({
            3: [[1, 3], [1, 4], [2, 4], [1, 2], [3, 1]],
            4: [[1, 4], [2, 5], [1, 3], [3, 6], [2, 4], [4, 7], [3, 5], [4, 5], [5, 6], [2, 3]],
            5: [[3, 5], [4, 6], [5, 7], [2, 6], [6, 8], [4, 5], [5, 6], [3, 8], [7, 8], [2, 3]],
            6: [[5, 7], [6, 8], [7, 9], [8, 10], [4, 9], [6, 7], [8, 9], [9, 10], [3, 10], [5, 6]]
        }) : null) || [[1, 4], [2, 5], [1, 3], [3, 6], [2, 4], [4, 7], [3, 5], [4, 5], [5, 6], [2, 3]];
        var ASK_FEWER = F ? F.age() >= 6 : false;
        function group(n) {
            return { value: String(n), label: '', alt: T.alt.replace('{n}', n), dots: n };
        }
        window.EarlyLesson = {
            lang: L,
            hero: { title: T.title, text: T.hero },
            title: T.title,
            instructions: T.intro,
            type: 'quiz',
            rounds: pairs.map(function(p, i) {
                var lo = Math.min(p[0], p[1]), hi = Math.max(p[0], p[1]);
                var fewer = ASK_FEWER && i % 2 === 1;
                return { key: (fewer ? 'fewer ' : '') + lo + ' vs ' + hi,
                         prompt: fewer ? T.fPrompt : T.prompt, speak: fewer ? T.fSpeak : T.speak, hint: fewer ? T.fHint : T.hint,
                         revealText: fewer ? T.fRevealText : T.revealText, revealSay: fewer ? T.fRevealSay : T.revealSay,
                         answer: String(fewer ? lo : hi), target: { emoji: '⚖️' }, options: [group(p[0]), group(p[1])] };
            })
        };
    </script>
    <script src="../skill-tracker.js"></script>
    <script src="../early-lesson.js"></script>
</body>
</html>
