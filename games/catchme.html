<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Cat - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <style>
        .hide-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            max-width: 420px;
            margin: 1.25rem auto;
        }
        .hide-spot {
            aspect-ratio: 1;
            min-height: 80px;
            border: 0;
            border-radius: 18px;
            background: #fff0a6;
            box-shadow: 0 6px 14px rgba(23, 50, 58, 0.14);
            font-size: 2.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: transform 0.15s ease;
        }
        .hide-spot:nth-child(3n+2) { background: #bfe8ef; }
        .hide-spot:nth-child(3n) { background: #ffd1da; }
        .hide-spot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: pop 0.35s ease-out;
        }
        .hide-spot.found { transform: scale(1.08); }
        .star-row {
            font-size: 2.2rem;
            letter-spacing: 6px;
            text-align: center;
            min-height: 2.6rem;
        }
        @keyframes pop {
            from { transform: scale(0.2); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            .hide-spot img { animation: none; }
        }
    </style>
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
    <script src="../pip.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Find the Cat</h1>
            <p>The cat is playing peekaboo. Find it and tap it!</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel">
                <div class="star-row" id="stars" aria-label="Stars collected"></div>
                <div style="text-align:center" data-pip-spot></div>
                <div class="hide-board" id="board"></div>
                <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
                <div class="actions">
                    <button type="button" class="lesson-action" id="playButton">Play</button>
                </div>
            </section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>

    <script>
        // A gentle visual-tracking and counting game: no timer, no losing.
        // The cat waits in its spot until the child finds it.
        (function() {
            var GOAL = 5;
            var SPOTS = 9;
            var board = document.getElementById('board');
            var stars = document.getElementById('stars');
            var feedback = document.getElementById('feedback');
            var playButton = document.getElementById('playButton');
            var found = 0;
            var catSpot = -1;
            var waiting = false;
            var cheers = ['You found me!', 'Peekaboo!', 'There I am!', 'Great looking!', 'Yay, you found me!'];
            var numberWords = ['one', 'two', 'three', 'four', 'five'];

            function speak(text) {
              // Shared calm, natural voice (speech.js), with a plain fallback.
              if (window.ESEASpeech) {
                ESEASpeech.speak(text);
                return;
              }
              if (!text || !window.speechSynthesis) return;
              window.speechSynthesis.cancel();
              var msg = new SpeechSynthesisUtterance(text);
              msg.rate = 0.85;
              window.speechSynthesis.speak(msg);
            }

            function say(text) {
                feedback.textContent = text;
                feedback.className = 'feedback good';
                speak(text);
            }

            function drawStars() {
                var html = '';
                for (var i = 0; i < GOAL; i += 1) html += i < found ? '⭐' : '☆';
                stars.innerHTML = html;
                stars.setAttribute('aria-label', found + ' of ' + GOAL + ' stars');
            }

            function buildBoard() {
                board.innerHTML = '';
                for (var i = 0; i < SPOTS; i += 1) {
                    var spot = document.createElement('button');
                    spot.type = 'button';
                    spot.className = 'hide-spot';
                    spot.dataset.index = String(i);
                    spot.setAttribute('aria-label', 'Hiding spot ' + (i + 1));
                    spot.addEventListener('click', onTap);
                    board.appendChild(spot);
                }
            }

            function hideCat() {
                var spots = board.querySelectorAll('.hide-spot');
                var next;
                do { next = Math.floor(Math.random() * SPOTS); } while (next === catSpot);
                catSpot = next;
                spots.forEach(function(spot) {
                    spot.innerHTML = '';
                    spot.classList.remove('found');
                    spot.setAttribute('aria-label', 'Hiding spot ' + (Number(spot.dataset.index) + 1));
                });
                spots[catSpot].innerHTML = '<img src="../images/cat.png" alt="">';
                spots[catSpot].setAttribute('aria-label', 'The cat!');
                waiting = true;
            }

            function onTap(event) {
                if (!waiting) return;
                var index = Number(event.currentTarget.dataset.index);
                if (index !== catSpot) {
                    say('Not here. Look for the cat!');
                    return;
                }
                waiting = false;
                found += 1;
                if (window.ESEAPip) ESEAPip.lessonEvent(found >= GOAL ? 'done' : 'correct');
                event.currentTarget.classList.add('found');
                drawStars();
                if (found >= GOAL) {
                    say('You found the cat ' + numberWords[GOAL - 1] + ' times! All done!');
                    playButton.textContent = 'Play Again';
                    playButton.hidden = false;
                    return;
                }
                say(cheers[Math.floor(Math.random() * cheers.length)] + ' ' + numberWords[found - 1] + '!');
                setTimeout(hideCat, 1400);
            }

            function start() {
                found = 0;
                catSpot = -1;
                drawStars();
                playButton.hidden = true;
                say('Where is the cat? Tap the cat!');
                hideCat();
            }

            buildBoard();
            drawStars();
            playButton.addEventListener('click', start);
        })();
    </script>
</body>
</html>
