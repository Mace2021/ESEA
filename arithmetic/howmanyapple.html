<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count the Apples - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Count the Apples</h1>
            <p>Count the apples with your finger, then tap the number.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        var numberChoices = [1, 2, 3, 4, 5].map(function(number) {
            return { value: String(number), label: String(number), symbol: String(number) };
        });
        function appleRound(count) {
            return {
                prompt: 'How many apples?',
                speak: 'How many apples do you see?',
                answer: String(count),
                target: { countImage: '../images/apple.png', count: count, alt: 'Apple' },
                options: numberChoices
            };
        }
        window.EarlyLesson = {
            title: 'Count Objects',
            instructions: 'Use small groups first. Count each apple one time.',
            type: 'quiz',
            rounds: [1, 2, 3, 4, 5].map(appleRound)
        };
    </script>
    <script src="../early-lesson.js"></script>
</body>
</html>
