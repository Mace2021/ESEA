<head>
    <meta charset="UTF-8">

<body data-page="arithmetic/math.html">

    <a  href="../index.html" class="back-button"
    >Math</a
  >
  <hr>
  <div id="math-container">
    <div id="mathboard">
      <div id="numerator">
        <input id="numerator1">
       
        <input id="numerator3">
        <input id="numerator4">
      </div>
      <div id="operator">
        <input id="operator1">
       
        <input id="operator3">
        <input id="operator4">
      </div>
      <div id="denominator">
        <input id="denominator1">
      
        <input id="denominator3">
        <input id="denominator4">
      </div>
      <div id="answerInput-cont">
        <input id="answerInput">
      
      </div>
    </div>

    <div id="answer-button">
      <button onclick="checkAnswer()">Check</button>
      <button  onclick="clearAnswer()" class="btn btn-danger">Clear</button>
      <div id="message" class="strong-message"></div>
    </div>
    <div id="tablenum" style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px;">
      <button onclick="document.getElementById('answerInput').value += '0'" class="letters" aria-label="Number 0">0</button>
      <button onclick="document.getElementById('answerInput').value += '1'" class="letters" aria-label="Number 1">1</button>
      <button onclick="document.getElementById('answerInput').value += '2'" class="letters" aria-label="Number 2">2</button>
      <button onclick="document.getElementById('answerInput').value += '3'" class="letters" aria-label="Number 3">3</button>
      <button onclick="document.getElementById('answerInput').value += '4'" class="letters" aria-label="Number 4">4</button>
      <button onclick="document.getElementById('answerInput').value += '5'" class="letters" aria-label="Number 5">5</button>
      <button onclick="document.getElementById('answerInput').value += '6'" class="letters" aria-label="Number 6">6</button>
      <button onclick="document.getElementById('answerInput').value += '7'" class="letters" aria-label="Number 7">7</button>
      <button onclick="document.getElementById('answerInput').value += '8'" class="letters" aria-label="Number 8">8</button>
      <button onclick="document.getElementById('answerInput').value += '9'" class="letters" aria-label="Number 9">9</button>
      <button onclick="document.getElementById('answerInput').value += '-'" class="letters" aria-label="Minus sign">-</button>
      <button onclick="document.getElementById('answerInput').value += '.'" class="letters" aria-label="Decimal point">.</button>

    </div>
  </div>

  <audio id="Correct" src="./audio/That is correct.mp3"></audio>
  <audio id="Incorrect" src="./audio/That is Incorrect.mp3"></audio>

  <script>
    function askQuestion() {
      let num1 = Math.floor(Math.random() * 10) + 1;
      let num2 = Math.floor(Math.random() * 10) + 1;

      while (num1 <= num2) {
        num1 = Math.floor(Math.random() * 10) + 11;
      }

      document.getElementById('numerator4').value = num1 % 10;
      document.getElementById('numerator3').value = Math.floor(num1 / 10) % 10;
   
      document.getElementById('denominator4').value = num2 % 10;
      document.getElementById('denominator3').value = Math.floor(num2 / 10) % 10;
   

      const operator = ['+', '-', '*', '/'][Math.floor(Math.random() * 4)];
      document.getElementById('operator1').value = operator;

      // Read question aloud
      let question = `${num1}`;
      if (operator === '+') {
        question += ' plus ';
      } else if (operator === '-') {
        question += ' minus ';
      } else if (operator === '*') {
        question += ' times ';
      } else {
       (operator === '÷') 
        question += ' divided by ';
      }
      question += `${num2}`;

      const utterance = new SpeechSynthesisUtterance(question);

      // Set voice to female
      utterance.voice = speechSynthesis.getVoices().filter(voice => voice.name === 'Google UK English Female')[0];

      speechSynthesis.speak(utterance);
    }


    function checkAnswer() {
      const num1 = parseInt(document.getElementById('numerator3').value) * 10 + parseInt(document.getElementById('numerator4').value);
      const num2 = parseInt(document.getElementById('denominator3').value) * 10 + parseInt(document.getElementById('denominator4').value);
      const operator = document.getElementById('operator1').value;
      let userAnswer = parseFloat(document.getElementById('answerInput').value);

      let correctAnswer;
      if (operator === '+') {
        correctAnswer = num1 + num2;
      } else if (operator === '-') {
        correctAnswer = num1 - num2;
      } else if (operator === '*') {
        correctAnswer = num1 * num2;
      } else if (operator === '/') {
        correctAnswer = num1 / num2;
      }

      correctAnswer = correctAnswer.toFixed(2);
      userAnswer = userAnswer.toFixed(2);

      const isCorrect = userAnswer == correctAnswer;

      if (isCorrect) {
        document.getElementById('message').textContent = "Correct!";
        playSound(true);
        setTimeout(() => {
          document.getElementById('message').textContent = "";
          clearAnswer();
          askQuestion();
        }, 1200);
      } else {
        document.getElementById('message').textContent = "Incorrect!";
        playSound(false);
      }

      // Set voice to female and speak feedback
      const resultUtterance = new SpeechSynthesisUtterance(isCorrect ? 'Correct!' : 'Incorrect!');
      resultUtterance.voice = speechSynthesis.getVoices().filter(voice => voice.name === 'Google UK English Female')[0];
      speechSynthesis.speak(resultUtterance);
    }



    function playSound(isCorrect) {
    const correctAudio = document.getElementById("Correct");
    const incorrectAudio = document.getElementById("Incorrect");

    // Pause any currently playing audio
    correctAudio.pause();
    correctAudio.currentTime = 0;
    incorrectAudio.pause();
    incorrectAudio.currentTime = 0;

    // Play the appropriate audio based on correctness
    if (isCorrect) {
        correctAudio.play();
    } else {
        incorrectAudio.play();
    }
}
   

    function clearAnswer() {
      document.getElementById('answerInput').value = '';
    }

    document.addEventListener('DOMContentLoaded', askQuestion);
</script>
