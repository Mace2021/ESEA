<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Rainbow - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <link rel="stylesheet" href="movie.css">
    <style>
        .rain-stage { background: linear-gradient(180deg, #dff3ff 0%, #f4fbff 70%, #c9efc2 70%, #b6e4ad 100%); min-height: 380px; }
        .rain-head { position: absolute; top: 14px; left: 0; right: 0; text-align: center; }
        .rain-head b { display: inline-block; font-size: clamp(3rem, 14vw, 5rem); line-height: 1; font-weight: 950; }
        .rain-head span { display: block; font-size: clamp(1.3rem, 6vw, 2rem); font-weight: 900; }
        .balloons { position: absolute; left: 4%; right: 4%; bottom: 8%; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 4px; }
        .balloon { width: clamp(44px, 13vw, 70px); position: relative; }
        .balloon b { position: absolute; top: 22%; left: 0; right: 0; text-align: center; color: #fff; font-size: clamp(1rem, 4vw, 1.4rem); font-weight: 900; text-shadow: 0 2px 2px rgba(0,0,0,0.25); }
        .balloon-svg { width: 100%; display: block; animation: sway 2.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
        .balloon.rise { animation: rise 0.9s cubic-bezier(0.2, 1.2, 0.4, 1) both; }
        @keyframes rise { from { transform: translateY(140px) scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
        .rainbow { position: absolute; left: 50%; bottom: 14%; width: min(92%, 520px); transform: translateX(-50%); }
        .rainbow path { fill: none; stroke-width: 22; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; transition: stroke-dashoffset 0.9s ease; }
        .rainbow path.drawn { stroke-dashoffset: 0; }
    </style>
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Counting Rainbow</h1>
            <p>Count the balloons of each color, then build a rainbow!</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a> <a class="home-button" href="tv.html">All videos</a></nav>
            <section class="lesson-card-panel">
                <div class="movie-stage rain-stage" id="stage"></div>
                <div class="movie-caption" id="caption" aria-live="polite">Tap Play to start.</div>
                <div class="movie-controls" id="controls"></div>
            </section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script src="../pip.js"></script>
    <script src="movie.js"></script>
    <script>
        var COLORS = [
            { name: 'red', hex: '#e53935' },
            { name: 'orange', hex: '#fb8c00' },
            { name: 'yellow', hex: '#f9c80e' },
            { name: 'green', hex: '#43a047' },
            { name: 'blue', hex: '#1e88e5' },
            { name: 'purple', hex: '#8e24aa' }
        ];
        var NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six'];
        var stage = document.getElementById('stage');
        var el = ESEAMovie.el;
        function balloonSvg(hex) {
            return '<svg class="balloon-svg" viewBox="0 0 60 100" aria-hidden="true">' +
                '<path d="M30 70 C 28 80, 34 88, 30 100" stroke="#777" stroke-width="1.5" fill="none"/>' +
                '<ellipse cx="30" cy="34" rx="26" ry="32" fill="' + hex + '"/>' +
                '<ellipse cx="21" cy="22" rx="6" ry="10" fill="#fff" opacity="0.35"/>' +
                '<path d="M26 66 L34 66 L30 72 Z" fill="' + hex + '"/></svg>';
        }
        function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }

        var scenes = [async function(ctx) {
            stage.innerHTML = '';
            var head = el('div', 'rain-head pop-in', '<span style="color:#7d3cff">Counting Rainbow</span>');
            stage.appendChild(head);
            await ctx.say('Let’s count balloons! Each color has a different number. Count with me!');
        }];
        COLORS.forEach(function(color, i) {
            var n = i + 1;
            var plural = n === 1 ? 'balloon' : 'balloons';
            scenes.push(async function(ctx) {
                stage.innerHTML = '';
                var head = el('div', 'rain-head pop-in', '<b style="color:' + color.hex + '">' + n + '</b><span style="color:' + color.hex + '">' + color.name + ' ' + plural + '</span>');
                var row = el('div', 'balloons');
                stage.appendChild(head);
                stage.appendChild(row);
                await ctx.say((n === 1 ? 'Here comes ' : 'Here come ') + NUM[n] + ' ' + color.name + ' ' + plural + '. Let’s count!');
                // One balloon floats up as each number is said.
                for (var k = 1; k <= n; k += 1) {
                    var b = el('div', 'balloon rise', balloonSvg(color.hex) + '<b>' + k + '</b>');
                    row.appendChild(b);
                    await ctx.say(String(k) + '!');
                }
                await ctx.say(cap(NUM[n]) + ' ' + color.name + ' ' + plural + '!');
                await ctx.wait(600);
            });
        });
        scenes.push(async function(ctx) {
            stage.innerHTML = '';
            var head = el('div', 'rain-head', '<span style="color:#7d3cff">Let’s make a rainbow!</span>');
            var paths = COLORS.map(function(c, i) {
                var r = 200 - i * 24;
                return '<path d="M ' + (240 - r) + ' 240 A ' + r + ' ' + r + ' 0 0 1 ' + (240 + r) + ' 240" stroke="' + c.hex + '"/>';
            }).join('');
            var bow = el('div', 'rainbow', '<svg viewBox="0 0 480 250" aria-hidden="true">' + paths + '</svg>');
            stage.appendChild(head);
            stage.appendChild(bow);
            await ctx.say('Now let’s use all the colors to make a rainbow!');
            var bands = bow.querySelectorAll('path');
            for (var i = 0; i < COLORS.length; i += 1) {
                bands[i].classList.add('drawn');
                await ctx.say(cap(COLORS[i].name) + '!');
            }
            head.innerHTML = '<span style="color:#7d3cff">We made a rainbow! &#127752;</span>';
            await ctx.say('We made a rainbow! Great counting!');
        });
        ESEAMovie.create({ stage: stage, caption: document.getElementById('caption'), controls: document.getElementById('controls'), scenes: scenes });
    </script>
</body>
</html>
