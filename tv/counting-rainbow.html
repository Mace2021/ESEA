<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Rainbow - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <style>
        .video-stage { padding: 1rem; }
        .rainbow-scene { min-height: 360px; border-radius: 20px; background: linear-gradient(180deg, #f2f9ff, #e8f2ff); position: relative; overflow: hidden; }
        .balloon { position: absolute; width: 80px; height: 110px; border-radius: 50% 50% 50% 50%; background: #ff8f91; box-shadow: inset -8px -8px 0 rgba(0,0,0,0.08); animation: floatBalloon 8s ease-in-out infinite alternate; }
        .balloon:nth-child(1){ left: 10%; top: 65%; background: #ffb347; animation-delay: 0s; }
        .balloon:nth-child(2){ left: 40%; top: 70%; background: #7ed6df; animation-delay: 1s; }
        .balloon:nth-child(3){ left: 70%; top: 60%; background: #9c88ff; animation-delay: 2s; }
        .number-label { position: absolute; top: 1.5rem; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.92); padding: 0.75rem 1rem; border-radius: 999px; font-size: 1.3rem; font-weight: 700; color: #2d2a67; }
        .video-controls { margin-top: 1rem; display:flex; gap:1rem; flex-wrap:wrap; }
        .video-controls button { padding: 0.85rem 1.2rem; border-radius: 999px; border:none; background: #9c6bff; color:#fff; font-weight:700; cursor:pointer; }
        @keyframes floatBalloon { from { transform: translateY(0);} to { transform: translateY(-40px);} }
    </style>
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Counting Rainbow</h1>
            <p>Watch bright balloons float by and count the colorful objects out loud.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel video-stage">
                <div class="rainbow-scene" id="rainbowScene">
                    <div class="number-label" id="countLabel">Count: 0</div>
                    <div class="balloon"></div>
                    <div class="balloon"></div>
                    <div class="balloon"></div>
                </div>
                <div class="video-controls">
                    <button id="playBtn">Play Video</button>
                    <button id="replayBtn">Replay</button>
                </div>
            </section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        const countLabel = document.getElementById('countLabel');
        const playBtn = document.getElementById('playBtn');
        const replayBtn = document.getElementById('replayBtn');
        const scenes = [
            { count: 1, voice: 'Let’s count! One... one bright yellow balloon.' },
            { count: 2, voice: 'Two... two blue balloons float up.' },
            { count: 3, voice: 'Three... three purple balloons wave hello!' }
        ];
        const ENDING = 'Great counting! You can watch it again any time.';

        function showScene(index) {
            countLabel.textContent = 'Count: ' + scenes[index].count;
        }

        // Narration uses the shared calm voice (speech.js). Each scene waits
        // for the narrator to finish, then pauses briefly before the next one.
        function speakText(text, onend) {
            if (window.ESEASpeech) {
                ESEASpeech.speak(text, { onend: onend });
                return;
            }
            if (window.speechSynthesis && text) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
            if (onend) setTimeout(onend, 3500);
        }

        let playId = 0;
        function playVideo() {
            const id = ++playId;
            let current = 0;
            function step() {
                if (id !== playId) return;
                if (current >= scenes.length) {
                    speakText(ENDING);
                    return;
                }
                showScene(current);
                speakText(scenes[current].voice, () => setTimeout(() => {
                    if (id !== playId) return;
                    current += 1;
                    step();
                }, 900));
            }
            step();
        }

        playBtn.addEventListener('click', playVideo);
        replayBtn.addEventListener('click', playVideo);
    </script>
</body>
</html>
