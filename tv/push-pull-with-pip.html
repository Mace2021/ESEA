<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push and Pull with Pip - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <link rel="stylesheet" href="movie.css">
    <style>
        .pip-stage { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 10px; padding: 18px 14px 14px; min-height: 400px;
            background: linear-gradient(180deg, #fff3d6 0%, #fff3d6 78%, #e7c49a 78%, #d9b083 100%); }
        .pip-stage .pip { align-self: end; z-index: 2; }
        .board { align-self: center; min-height: 270px; background: #2f5d50; border: 10px solid #a0703c; border-radius: 16px; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 14px; text-align: center; box-shadow: inset 0 0 30px rgba(0,0,0,0.25); }
        .board-big { font-size: clamp(4rem, 17vw, 7rem); font-weight: 950; line-height: 1; color: #fff7c2; font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; }
        .board-big small { font-size: 0.65em; color: #ffd1da; margin-left: 0.08em; }
        .board-pic { background: #fff; border-radius: 16px; padding: 8px; width: min(170px, 60%); }
        .board-pic img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; border-radius: 10px; }
        .board-pic span { display: block; color: #2d2a67; font-weight: 900; font-size: 1.3rem; }
        .board-title { font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 900; color: #fff7c2; }
        .board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; width: 100%; }
        .board-grid span { border: 2px dashed rgba(255,255,255,0.35); border-radius: 8px; padding: 4px 0; font-weight: 900; font-size: 1.3rem; transition: transform 0.2s, background 0.2s; }
        .board-grid span.lit { background: #ffc94d; color: #2d2a67; transform: scale(1.18); border-color: transparent; }
        .board-things { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 100%; }
        .board-things i { font-style: normal; font-size: clamp(1.8rem, 8vw, 2.6rem); line-height: 1.1; }
        @media (max-width: 520px) {
            .pip-stage { grid-template-columns: 1fr; padding-bottom: 150px; }
            .pip-stage .pip { position: absolute; left: 10px; bottom: 8px; width: 104px; }
            .board { min-height: 220px; }
        }
        .track { position: relative; width: 100%; height: 90px; border-bottom: 6px solid #fff7c2; }
        .mover { position: absolute; bottom: 2px; font-size: clamp(2.4rem, 10vw, 3rem); line-height: 1; transition: left 1.2s cubic-bezier(.2,.6,.3,1); }
        .mover.slow { transition-duration: 2.4s; }
        .hand { position: absolute; bottom: 6px; font-size: 2rem; transition: left 0.5s; }
        .result { font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: 950; color: #fff7c2; min-height: 2rem; }
        .ramps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .ramp { position: relative; height: 120px; overflow: hidden; }
        .ramp svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .ramp .car { position: absolute; font-size: 1.7rem; line-height: 1; left: 0; transition: left 2.6s ease-in, top 2.6s ease-in; }
        .ramp.steep .car { transition-duration: 1.2s; }
        .ramp b { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; color: #fff7c2; }
        .words { display: flex; gap: 12px; justify-content: center; }
        .words span { background: rgba(255,255,255,0.14); color: #fff7c2; border-radius: 12px; padding: 8px 14px; font-weight: 950; font-size: 1.3rem; }
        @media (prefers-reduced-motion: reduce) { .mover, .ramp .car, .hand { transition: none; } }
    </style>
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Push and Pull with Pip</h1>
            <p>Pushes and pulls make things move. Ramps make them roll. Explore forces with Pip!</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a> <a class="home-button" href="tv.html">All videos</a></nav>
            <section class="lesson-card-panel">
                <div class="movie-stage pip-stage" id="stage"><div id="pip"></div><div class="board" id="board"></div></div>
                <div class="movie-caption" id="caption" aria-live="polite">Tap Play to start.</div>
                <div class="movie-controls" id="controls"></div>
            </section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script src="movie.js"></script>
    <script src="../pip.js"></script>
    <script>
        var board = document.getElementById('board');
        var pip = ESEAMovie.character(document.getElementById('pip'));
        function show(html) { board.innerHTML = html; }
        function $(id) { return document.getElementById(id); }
        function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }
        function track(item, left, label) {
            return '<div class="track" role="img" aria-label="' + label + '"><span class="mover" id="mv" style="left:' + left + '%" aria-hidden="true">' + item + '</span></div>';
        }
        function ramp(cls, label, y0) {
            // y0 = how high the ramp starts (percent from top); steeper ramps start higher.
            return '<div class="ramp ' + cls + '" role="img" aria-label="' + label + '"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,' + y0 + ' 100,86 0,86" fill="#c49a6c"/></svg>' +
                '<span class="car" style="top:calc(' + y0 + '% - 1.7rem)" aria-hidden="true">🚗</span><b>' + label + '</b></div>';
        }
        var scenes = [async function(ctx) {
            show('<div class="board-title pop-in">Push and Pull!</div><div class="words"><span>👐 Push</span><span>🪢 Pull</span></div>');
            pip.wave();
            await ctx.say('Hi! It’s Pip! Things don’t move all by themselves. They need a push, or a pull! Pushes and pulls are called forces.');
        }, async function(ctx) {
            show('<div class="board-title">Push!</div>' + track('⚽', 4, 'a ball next to Pip') + '<div class="result" id="res"></div>');
            pip.point();
            await ctx.say('A push moves something away from you. Let’s push the ball. Ready? Push!');
            $('mv').style.left = '80%';
            await ctx.wait(1300);
            $('res').textContent = 'Away from Pip!';
            pip.jump(1200);
            await ctx.say('The ball rolled away from me. That was a push!');
        }, async function(ctx) {
            show('<div class="board-title">Pull!</div>' + track('🧸', 78, 'a teddy bear on a string, far from Pip') + '<div class="result" id="res"></div>');
            pip.point();
            await ctx.say('A pull brings something closer to you. My teddy is on a string. Let’s pull it. Pull!');
            $('mv').classList.add('slow');
            $('mv').style.left = '6%';
            await ctx.wait(2500);
            $('res').textContent = 'Closer to Pip!';
            pip.jump(1200);
            await ctx.say('Teddy came closer to me. That was a pull!');
        }, async function(ctx) {
            show('<div class="board-title">Small push or big push?</div>' + track('🚗', 4, 'a toy car') + '<div class="result" id="res"></div>');
            pip.point();
            await ctx.say('Here is a toy car. A small push, or a big push. Which one makes it go farther?');
            await ctx.wait(1800);
            await ctx.say('A small push...');
            $('mv').style.left = '28%';
            await ctx.wait(1300);
            await ctx.say('And now, a big push!');
            $('mv').style.left = '82%';
            await ctx.wait(1300);
            $('res').textContent = 'A big push goes farther!';
            pip.jump(1200);
            await ctx.say('A big push makes it go farther, and faster!');
        }, async function(ctx) {
            show('<div class="board-title">Ramps!</div><div class="ramps">' + ramp('low', 'Low ramp', 58) + ramp('steep', 'Steep ramp', 8) + '</div><div class="result" id="res"></div>');
            pip.point();
            await ctx.say('A ramp is a slope. Here are two ramps. A low one, and a steep one. Which car will get to the bottom first?');
            await ctx.wait(1800);
            await ctx.say('Let’s let go! Ready, set, go!');
            board.querySelectorAll('.ramp .car').forEach(function(car) { car.style.left = 'calc(100% - 1.9rem)'; car.style.top = 'calc(86% - 1.7rem)'; });
            await ctx.wait(2700);
            $('res').textContent = 'The steep ramp is faster!';
            pip.jump(1200);
            await ctx.say('The car on the steep ramp was faster! Gravity pulls things down, and a steep ramp lets them speed up more.');
        }, async function(ctx) {
            show('<div class="board-title pop-in">Try it at home! 📚</div><div class="words"><span>📚 + 🚗</span></div>');
            pip.wave(4000);
            await ctx.say('Make a ramp with a book, and roll a toy car. Then make it steeper! Push a ball, pull a blanket. Now play the Push or Pull game. Bye-bye!');
        }];
        ESEAMovie.create({ stage: document.getElementById('stage'), caption: document.getElementById('caption'), controls: document.getElementById('controls'), character: pip, scenes: scenes });
        show('<div class="board-title">Push and Pull with Pip</div>');
    </script>
</body>
</html>
