<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Match with Pip - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <link rel="stylesheet" href="movie.css">
    <style>
        .pip-stage { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 10px; padding: 18px 14px 14px; min-height: 400px;
            background: linear-gradient(180deg, #fff3d6 0%, #fff3d6 78%, #e7c49a 78%, #d9b083 100%); }
        .pip-stage .pip { align-self: end; z-index: 2; }
        .board { align-self: center; min-height: 270px; background: #2f5d50; border: 10px solid #a0703c; border-radius: 16px; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 14px; text-align: center; box-shadow: inset 0 0 30px rgba(0,0,0,0.25); }
        .board-big { font-size: clamp(4rem, 17vw, 7rem); font-weight: 950; line-height: 1; color: #fff7c2; font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; }
        .board-big small { font-size: 0.65em; color: #ffd1da; margin-left: 0.08em; }
        .board-pic { background: #fff; border-radius: 16px; padding: 8px; width: min(170px, 60%); }
        .board-pic img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; border-radius: 10px; }
        .board-pic span { display: block; color: #2d2a67; font-weight: 900; font-size: 1.3rem; }
        .board-title { font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 900; color: #fff7c2; }
        .board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; width: 100%; }
        .board-grid span { border: 2px dashed rgba(255,255,255,0.35); border-radius: 8px; padding: 4px 0; font-weight: 900; font-size: 1.3rem; transition: transform 0.2s, background 0.2s; }
        .board-grid span.lit { background: #ffc94d; color: #2d2a67; transform: scale(1.18); border-color: transparent; }
        .board-things { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 100%; }
        .board-things i { font-style: normal; font-size: clamp(1.8rem, 8vw, 2.6rem); line-height: 1.1; }
        @media (max-width: 520px) {
            .pip-stage { grid-template-columns: 1fr; padding-bottom: 150px; }
            .pip-stage .pip { position: absolute; left: 10px; bottom: 8px; width: 104px; }
            .board { min-height: 220px; }
        }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        .cards.two { grid-template-columns: repeat(2, 1fr); }
        .ncard { background: rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 6px 2px; color: #fff7c2; font-weight: 950; font-size: clamp(2.2rem, 10vw, 3rem); line-height: 1.1; transition: transform 0.25s, background 0.25s, opacity 0.25s;
            font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; }
        .ncard.lit { background: #ffc94d; color: #2d2a67; transform: scale(1.12); }
        .ncard.dim { opacity: 0.4; }
        .pair { display: flex; align-items: flex-end; justify-content: center; gap: 0.25em; }
        .pair .big, .pair .small { font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; font-weight: 950; line-height: 1; }
        .pair .big { font-size: clamp(4rem, 17vw, 5.6rem); color: #fff7c2; }
        .pair .small { font-size: clamp(3rem, 12vw, 4rem); color: #ffd1da; min-width: 0.7em; }
        .pairs { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
        .pairs .pair .big { font-size: clamp(3rem, 12vw, 4rem); } .pairs .pair .small { font-size: clamp(2.2rem, 9vw, 2.8rem); }
        .labels { display: flex; justify-content: center; gap: 30px; color: #fff7c2; font-weight: 900; }
        .bed { font-size: clamp(2.6rem, 11vw, 3.4rem); }
    </style>
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Letter Match with Pip</h1>
            <p>Big letters and little letters. Match them with Pip!</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a> <a class="home-button" href="tv.html">All videos</a></nav>
            <section class="lesson-card-panel">
                <div class="movie-stage pip-stage" id="stage"><div id="pip"></div><div class="board" id="board"></div></div>
                <div class="movie-caption" id="caption" aria-live="polite">Tap Play to start.</div>
                <div class="movie-controls" id="controls"></div>
            </section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script src="movie.js"></script>
    <script src="../pip.js"></script>
    <script>
        var board = document.getElementById('board');
        var pip = ESEAMovie.character(document.getElementById('pip'));
        var F = window.ESEAFamily;
        function show(html) { board.innerHTML = html; }
        // Younger children choose from two cards, older ones from three.
        var CHOICES = (F && F.age && F.age() <= 3) ? 2 : 3;
        // The answer goes in a different place each round.
        function cardsHtml(answer, others, i, label) {
            var list = others.slice(0, CHOICES - 1);
            list.splice(i % CHOICES, 0, answer);
            return '<div class="cards' + (CHOICES === 2 ? ' two' : '') + '">' + list.map(function(v) {
                return '<div class="ncard" data-v="' + v + '" aria-label="' + label(v) + '">' + v + '</div>';
            }).join('') + '</div>';
        }
        function reveal(v) {
            board.querySelectorAll('.ncard').forEach(function(c) { c.classList.add(c.dataset.v === String(v) ? 'lit' : 'dim'); });
        }
        // Same letters the Letter Match game uses for each age, with look-alike little letters as the wrong answers.
        var LETTERS = F && F.byAge ? F.byAge({ 3: ['A', 'B', 'E'], 4: ['A', 'B', 'D', 'E'], 5: ['A', 'B', 'D', 'G', 'R'], 6: ['A', 'B', 'D', 'G', 'Q', 'R'] }) : ['A', 'B', 'D', 'E'];
        var LOOKALIKE = { a: ['o', 'e'], b: ['d', 'p'], d: ['b', 'q'], e: ['c', 'a'], g: ['q', 'p'], q: ['p', 'g'], r: ['n', 'h'] };
        var scenes = [async function(ctx) {
            show('<div class="board-title pop-in">Letter Match</div><div class="pair"><span class="big">A</span><span class="small">a</span></div><div class="labels"><span>big</span><span>little</span></div>');
            pip.wave();
            await ctx.say('Hi! It’s Pip! Every letter has a big letter and a little letter. They have the same name, and make the same sound.');
            pip.point();
            await ctx.say('This is big [A], and little [A]. Let’s match big letters with their little letters!');
        }, async function(ctx) {
            show('<div class="board-title pop-in">Look the same!</div><div class="pairs">' + ['C', 'O', 'S'].map(function(L) {
                return '<div class="pair"><span class="big">' + L + '</span><span class="small">' + L.toLowerCase() + '</span></div>';
            }).join('') + '</div>');
            pip.point();
            await ctx.say('Some letters look the same, just smaller. Big [C], little [C]. Big [O], little [O]. Big [S], little [S].');
            await ctx.say('Other letters look different. Let’s find those!');
        }];
        LETTERS.forEach(function(L, i) {
            scenes.push(async function(ctx) {
                var l = L.toLowerCase();
                show('<div class="pair"><span class="big pop-in">' + L + '</span><span class="small" id="slot"></span></div>' +
                    cardsHtml(l, LOOKALIKE[l] || ['o', 'n'], i, function(v) { return 'little letter ' + v; }));
                pip.point();
                await ctx.say('This is big [' + L + ']. Which little letter matches?');
                await ctx.wait(1800); // time to point and answer
                reveal(l);
                document.getElementById('slot').innerHTML = '<span class="pop-in" style="display:inline-block">' + l + '</span>';
                pip.jump(1200);
                await ctx.say('Little [' + L + ']! Big [' + L + '], little [' + L + '].');
            });
        });
        scenes.push(async function(ctx) {
            show('<div class="board-title pop-in">Tricky b and d</div><div class="pairs"><div class="pair"><span class="small" style="color:#fff7c2">b</span></div><div class="pair"><span class="small" style="color:#fff7c2">d</span></div></div><div class="bed" role="img" aria-label="bed">🛏️</div>');
            pip.point();
            await ctx.say('Little [B] and little [D] look a lot alike! Here is a trick. Make two fists, and put your thumbs up.');
            await ctx.wait(1200);
            await ctx.say('Your left hand makes a [B]. Your right hand makes a [D]. Together they make a bed! [B] comes first, [D] comes last.');
        });
        scenes.push(async function(ctx) {
            show('<div class="board-title pop-in">Your turn! &#11088;</div><div class="pairs">' + LETTERS.slice(0, 3).map(function(L) {
                return '<div class="pair"><span class="big">' + L + '</span><span class="small">' + L.toLowerCase() + '</span></div>';
            }).join('') + '</div>');
            pip.wave(4000);
            await ctx.say('Great matching! Now try the Letter Match game. At home, look for big and little letters on signs and in books. Bye-bye!');
        });
        ESEAMovie.create({ stage: document.getElementById('stage'), caption: document.getElementById('caption'), controls: document.getElementById('controls'), character: pip, scenes: scenes });
        show('<div class="board-title">Letter Match with Pip</div>');
    </script>
</body>
</html>
