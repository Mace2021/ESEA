<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna the Little Cloud - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <link rel="stylesheet" href="movie.css">
    <style>
        .story-stage { min-height: 400px; background: linear-gradient(180deg, #8fd0ff 0%, #d7f0ff 62%, #8ccf7a 62%, #6fbf5d 100%); transition: background 1.5s ease; }
        .story-stage.hot { background: linear-gradient(180deg, #ffd27a 0%, #fff0c2 62%, #c9c46a 62%, #b5ad55 100%); }
        .story-stage.rainy { background: linear-gradient(180deg, #a9bfd6 0%, #dfe8f2 62%, #79b86a 62%, #5ea84f 100%); }
        .story-stage.sunset { background: linear-gradient(180deg, #ffb38a 0%, #ffe3c7 62%, #8ccf7a 62%, #6fbf5d 100%); }
        .title-card { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 5; pointer-events: none; }
        .title-card h2 { margin: 0; font-size: clamp(2rem, 9vw, 3.2rem); color: #fff; text-shadow: 0 3px 0 #3d7fd6, 0 6px 18px rgba(0,0,0,0.2); }
        .title-card p { margin: 6px 0 0; font-weight: 900; color: #245f73; font-size: 1.2rem; }
        .sun { position: absolute; top: 18px; right: 18px; width: 86px; transition: transform 1.5s ease; z-index: 1; }
        .story-stage.hot .sun { transform: scale(1.5) translate(-10px, 10px); }
        .story-stage.rainy .sun { transform: scale(0.8) translateY(-10px); opacity: 0.6; }
        .sun svg { width: 100%; display: block; }
        .sun .rays { transform-origin: 50px 50px; animation: spin-slow 18s linear infinite; }
        .big-cloud { position: absolute; height: 46px; background: #fff; border-radius: 40px; opacity: 0.85; z-index: 1; transition: transform 6s linear; }
        .big-cloud.c1 { width: 150px; top: 30px; left: -170px; }
        .big-cloud.c2 { width: 110px; top: 90px; left: -130px; }
        .story-stage.clouds-go .big-cloud.c1 { transform: translateX(calc(100vw + 400px)); }
        .story-stage.clouds-go .big-cloud.c2 { transform: translateX(calc(100vw + 300px)); transition-duration: 7s; }
        .luna { position: absolute; top: 70px; left: -40%; width: clamp(150px, 40vw, 210px); z-index: 3; transition: left 2.2s ease-in-out, transform 0.4s ease; }
        .luna svg { width: 100%; display: block; animation: float 3s ease-in-out infinite alternate; }
        .luna.puff { transform: scale(1.18); }
        .luna.bounce svg { animation: hop 0.5s ease-in-out 4 alternate; }
        .luna .m, .luna .e { display: none; }
        .luna.happy .m-happy, .luna.happy .e-open,
        .luna.sad .m-sad, .luna.sad .e-sad,
        .luna.puff .m-o, .luna.puff .e-open,
        .luna.sneeze .m-sneeze, .luna.sneeze .e-shut,
        .luna.giggle .m-happy, .luna.giggle .e-shut { display: inline; }
        .rain { position: absolute; top: 160px; height: 200px; width: 160px; z-index: 2; opacity: 0; transition: opacity 0.4s; pointer-events: none;
            background-image: repeating-linear-gradient(105deg, transparent 0 14px, rgba(61,127,214,0.75) 14px 16px, transparent 16px 30px);
            background-size: 30px 40px; animation: rainfall 0.5s linear infinite; }
        .rain.on { opacity: 1; }
        .flower { position: absolute; bottom: 9%; left: 52%; width: clamp(70px, 18vw, 96px); z-index: 2; }
        .flower svg { width: 100%; display: block; overflow: visible; }
        .flower .head { transform-origin: 50px 66px; transition: transform 1.2s ease, filter 1.2s ease; }
        .flower.droop .head { transform: rotate(68deg) translate(6px, 8px); filter: grayscale(0.85); }
        .flower .petal { transition: fill 1.2s ease; }
        .flower.bloom .head { animation: grow 0.8s ease-out; }
        .speech { position: absolute; z-index: 6; background: #fff; border-radius: 16px; padding: 8px 12px; font-weight: 900; color: #2d2a67; font-size: clamp(1rem, 4.2vw, 1.25rem); box-shadow: 0 6px 14px rgba(0,0,0,0.12); max-width: 60%; }
        .frog, .bird { position: absolute; font-size: clamp(2.6rem, 11vw, 3.4rem); z-index: 3; transition: left 1.2s ease, transform 0.3s; }
        .frog { bottom: 6%; left: -20%; }
        .frog.in { left: 18%; }
        .frog.hop { animation: hop 0.35s ease-in-out 6 alternate; }
        .pond { position: absolute; bottom: 4%; left: 10%; width: 120px; height: 26px; border-radius: 50%; background: #5aa9e6; opacity: 0; transition: opacity 1s; z-index: 1; }
        .pond.on { opacity: 0.85; }
        .bird { top: 40px; left: 110%; }
        .bird.in { left: 8%; }
        .rainbow { position: absolute; left: 50%; bottom: 30%; width: min(96%, 560px); transform: translateX(-50%); z-index: 1; }
        .rainbow path { fill: none; stroke-width: 16; stroke-dasharray: 700; stroke-dashoffset: 700; transition: stroke-dashoffset 1.6s ease; }
        .rainbow.on path { stroke-dashoffset: 0; }
        .the-end { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: 36%; white-space: nowrap; padding: 4px 22px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); font-size: clamp(2rem, 9vw, 3rem); font-weight: 950; color: #a3214f; box-shadow: 0 6px 16px rgba(0,0,0,0.12); z-index: 6; }
        @keyframes float { from { transform: translateY(0); } to { transform: translateY(-12px); } }
        @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-18px); } }
        @keyframes spin-slow { to { transform: rotate(360deg); } }
        @keyframes rainfall { from { background-position: 0 0; } to { background-position: -8px 40px; } }
        @keyframes grow { from { transform: scale(0.6); } to { transform: scale(1); } }
        @media (prefers-reduced-motion: reduce) { .luna svg, .sun .rays, .rain { animation: none; } }
    </style>
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Luna the Little Cloud</h1>
            <p>A short animated story about a tiny cloud with a big heart.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a> <a class="home-button" href="tv.html">All videos</a></nav>
            <section class="lesson-card-panel">
                <div class="movie-stage story-stage" id="stage"></div>
                <div class="movie-caption" id="caption" aria-live="polite">Tap Play to start.</div>
                <div class="movie-controls" id="controls"></div>
            </section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script src="movie.js"></script>
    <script>
        // An original bedtime-style story for 3 to 6 year olds: a tiny cloud
        // who thinks she is too small to help, until a thirsty flower needs her.
        // (Gentle message: everyone, even someone small, can help.)
        var stage = document.getElementById('stage');
        var el = ESEAMovie.el;

        var LUNA = '<svg viewBox="0 0 220 140" aria-hidden="true">' +
            '<path d="M48 120 C14 120 10 80 40 74 C34 40 76 26 96 48 C106 14 162 14 168 52 C204 50 214 96 186 112 C182 122 170 122 162 120 Z" fill="#fff" stroke="#bcd8f2" stroke-width="4"/>' +
            '<ellipse cx="78" cy="96" rx="11" ry="7" fill="#ffb3c4" opacity="0.8"/><ellipse cx="150" cy="96" rx="11" ry="7" fill="#ffb3c4" opacity="0.8"/>' +
            '<g class="e e-open"><ellipse cx="94" cy="80" rx="7" ry="9" fill="#2b2140"/><ellipse cx="134" cy="80" rx="7" ry="9" fill="#2b2140"/><circle cx="96" cy="77" r="2.5" fill="#fff"/><circle cx="136" cy="77" r="2.5" fill="#fff"/></g>' +
            '<g class="e e-sad"><ellipse cx="94" cy="84" rx="7" ry="6" fill="#2b2140"/><ellipse cx="134" cy="84" rx="7" ry="6" fill="#2b2140"/><path d="M84 72 L102 76 M144 72 L126 76" stroke="#2b2140" stroke-width="3" stroke-linecap="round"/></g>' +
            '<g class="e e-shut"><path d="M86 82 Q94 74 102 82 M126 82 Q134 74 142 82" stroke="#2b2140" stroke-width="4" fill="none" stroke-linecap="round"/></g>' +
            '<path class="m m-happy" d="M102 98 Q114 112 126 98" stroke="#7a2e2e" stroke-width="4" fill="none" stroke-linecap="round"/>' +
            '<path class="m m-sad" d="M102 106 Q114 96 126 106" stroke="#7a2e2e" stroke-width="4" fill="none" stroke-linecap="round"/>' +
            '<circle class="m m-o" cx="114" cy="102" r="6" fill="#7a2e2e"/>' +
            '<ellipse class="m m-sneeze" cx="114" cy="104" rx="12" ry="9" fill="#7a2e2e"/>' +
            '</svg>';
        var SUN = '<svg viewBox="0 0 100 100" aria-hidden="true"><g class="rays" fill="#ffb300">' +
            [0, 45, 90, 135, 180, 225, 270, 315].map(function(a) { return '<rect x="47" y="2" width="6" height="16" rx="3" transform="rotate(' + a + ' 50 50)"/>'; }).join('') +
            '</g><circle cx="50" cy="50" r="28" fill="#ffd54f"/><circle cx="41" cy="46" r="3" fill="#7a4a00"/><circle cx="59" cy="46" r="3" fill="#7a4a00"/><path d="M40 58 Q50 66 60 58" stroke="#7a4a00" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
        var FLOWER = '<svg viewBox="0 0 100 150" aria-hidden="true"><path d="M50 150 C48 120 52 100 50 66" stroke="#2e7d32" stroke-width="6" fill="none"/>' +
            '<path d="M50 118 C30 110 26 96 34 92 C44 96 50 106 50 118Z" fill="#43a047"/><path d="M50 110 C70 102 76 90 68 86 C58 90 52 100 50 110Z" fill="#43a047"/>' +
            '<g class="head">' + [0, 60, 120, 180, 240, 300].map(function(a) { return '<ellipse class="petal" cx="50" cy="36" rx="11" ry="18" fill="#ec5f9b" transform="rotate(' + a + ' 50 54)"/>'; }).join('') +
            '<circle cx="50" cy="54" r="12" fill="#ffc94d"/><circle cx="46" cy="52" r="1.8" fill="#5a3a00"/><circle cx="54" cy="52" r="1.8" fill="#5a3a00"/><path d="M45 58 Q50 62 55 58" stroke="#5a3a00" stroke-width="1.6" fill="none"/></g></svg>';

        function setup() {
            stage.className = 'movie-stage story-stage';
            stage.innerHTML = '<div class="big-cloud c1"></div><div class="big-cloud c2"></div>' +
                '<div class="sun" id="sun">' + SUN + '</div>' +
                '<div class="rainbow" id="rainbow"><svg viewBox="0 0 480 250">' +
                ['#e53935', '#fb8c00', '#f9c80e', '#43a047', '#1e88e5', '#8e24aa'].map(function(c, i) {
                    var r = 200 - i * 17; return '<path d="M ' + (240 - r) + ' 240 A ' + r + ' ' + r + ' 0 0 1 ' + (240 + r) + ' 240" stroke="' + c + '"/>';
                }).join('') + '</svg></div>' +
                '<div class="pond" id="pond"></div>' +
                '<div class="luna happy" id="luna">' + LUNA + '</div>' +
                '<div class="rain" id="rain"></div>' +
                '<div class="flower droop" id="flower">' + FLOWER + '</div>' +
                '<div class="frog" id="frog" aria-hidden="true">🐸</div>' +
                '<div class="bird" id="bird" aria-hidden="true">🐦</div>';
        }
        function $(id) { return document.getElementById(id); }
        function luna(face, left) {
            var l = $('luna');
            l.classList.remove('happy', 'sad', 'puff', 'sneeze', 'giggle');
            l.classList.add(face);
            if (left !== undefined) l.style.left = left;
        }
        function bubble(text, left, top) {
            Array.prototype.slice.call(stage.querySelectorAll('.speech')).forEach(function(n) { n.remove(); });
            if (!text) return;
            var b = el('div', 'speech pop-in', text);
            b.style.left = left; b.style.top = top;
            stage.appendChild(b);
        }
        function placeRain() {
            var l = $('luna'), r = $('rain');
            r.style.left = (l.offsetLeft + l.offsetWidth * 0.12) + 'px';
            r.style.width = (l.offsetWidth * 0.76) + 'px';
            r.style.top = (l.offsetTop + l.offsetHeight * 0.55) + 'px';
        }

        var scenes = [
            async function(ctx) {
                setup();
                stage.appendChild(el('div', 'title-card pop-in', '<div><h2>Luna the Little Cloud</h2><p>A story from ESEA</p></div>'));
                await ctx.say('Luna the Little Cloud.');
                await ctx.wait(700);
            },
            async function(ctx) {
                setup();
                luna('happy', '-40%');
                await ctx.wait(50);
                luna('happy', '8%');
                await ctx.say('Once upon a time, high up in the big blue sky, there lived a little cloud named Luna.');
                stage.classList.add('clouds-go');
                await ctx.say('All around her, the big clouds were busy, floating far, far away.');
                luna('sad');
                bubble('I’m so small...', '46%', '60px');
                await ctx.say('Luna looked at herself and sighed. “I’m so small,” she said. “What can a little cloud like me do?”');
                bubble('');
            },
            async function(ctx) {
                stage.classList.add('hot');
                await ctx.say('It was a very hot day. The sun was shining... and shining... and shining!');
                await ctx.wait(400);
                var f = $('flower');
                bubble('I’m so thirsty...', '24%', '52%');
                await ctx.say('Far below, in a little garden, a flower was drooping. “I’m so thirsty,” she whispered.');
                bubble('');
                luna('sad', '36%');
                await ctx.wait(1200);
                await ctx.say('Luna looked down. “Oh no! That flower needs water!”');
            },
            async function(ctx) {
                luna('puff');
                await ctx.say('Luna puffed... and puffed... and PUFFED! But nothing happened.');
                luna('sad');
                await ctx.wait(600);
                luna('puff');
                await ctx.say('Then she felt a tickle in her nose. Ah... ah... ah...');
                luna('sneeze');
                stage.classList.remove('hot');
                stage.classList.add('rainy');
                placeRain();
                $('rain').classList.add('on');
                $('pond').classList.add('on');
                await ctx.say('Ah-CHOO!');
                luna('giggle');
                await ctx.say('Out came a shower of rain! Pitter, patter. Pitter, patter.');
            },
            async function(ctx) {
                var f = $('flower');
                f.classList.remove('droop');
                f.classList.add('bloom');
                await ctx.say('The little flower drank and drank. Then she lifted her head... and bloomed, bright and pink!');
                bubble('Thank you, Luna!', '30%', '48%');
                await ctx.say('“Thank you, Luna!” said the flower.');
                bubble('');
                $('frog').classList.add('in');
                await ctx.wait(1200);
                $('frog').classList.add('hop');
                bubble('Ribbit! More rain, please!', '4%', '50%');
                await ctx.say('Ribbit! A frog hopped out to splash in the puddles. “More rain, please!” he croaked.');
                bubble('');
                luna('giggle');
                await ctx.say('Luna giggled. Hee, hee, hee!');
            },
            async function(ctx) {
                $('rain').classList.remove('on');
                stage.classList.remove('rainy');
                luna('happy', '6%');
                await ctx.say('Then the sun came out to say hello again...');
                $('rainbow').classList.add('on');
                $('bird').classList.add('in');
                await ctx.say('...and where the sunshine met Luna’s rain, a beautiful rainbow appeared!');
                await ctx.say('Red, orange, yellow, green, blue, and purple!');
            },
            async function(ctx) {
                stage.classList.add('sunset');
                luna('happy');
                $('luna').classList.add('bounce');
                bubble('I’m small, but I can help!', '44%', '58px');
                await ctx.say('Luna smiled the biggest smile. “I’m small,” she said, “but I can still help!”');
                bubble('');
                await ctx.say('And from that day on, whenever a garden was thirsty, Luna floated by to say hello.');
                stage.appendChild(el('div', 'the-end pop-in', 'The End'));
                await ctx.say('The end.');
                await ctx.wait(800);
                await ctx.say('How can you help someone today?');
            }
        ];
        setup();
        $('luna').style.left = '8%';
        stage.appendChild(el('div', 'title-card', '<div><h2>Luna the Little Cloud</h2><p>Tap Play to watch</p></div>'));
        ESEAMovie.create({ stage: stage, caption: document.getElementById('caption'), controls: document.getElementById('controls'), scenes: scenes });
    </script>
</body>
</html>
