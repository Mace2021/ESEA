<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Routines - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Daily Routines</h1>
            <p>Practice days, months, and simple routine words without a busy calendar.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        window.EarlyLesson = {
            title: 'Calendar Words',
            instructions: 'Tap a word to hear it. Use these words during your real daily routine.',
            type: 'explore',
            sections: [
                {
                    title: 'Days of the Week',
                    items: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'].map(function(day) {
                        return { label: day, emoji: '&#128197;', speak: day };
                    })
                },
                {
                    title: 'Routine Words',
                    items: [
                        { label: 'Morning', emoji: '&#127749;', note: 'Wake up and start the day.', speak: 'Morning' },
                        { label: 'Afternoon', emoji: '&#9728;', note: 'The middle of the day.', speak: 'Afternoon' },
                        { label: 'Night', emoji: '&#127769;', note: 'Rest and sleep time.', speak: 'Night' },
                        { label: 'Today', emoji: '&#11088;', note: 'This day.', speak: 'Today' },
                        { label: 'Tomorrow', emoji: '&#127775;', note: 'The next day.', speak: 'Tomorrow' },
                        { label: 'Yesterday', emoji: '&#128338;', note: 'The day before today.', speak: 'Yesterday' }
                    ]
                }
            ]
        };
    </script>
    <script src="../early-lesson.js"></script>
</body>
</html>
