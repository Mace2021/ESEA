<script>
    const words = ['Apple', 'Boy', 'Cat', 'Dog', 'Elephant', 'Fish', 'Goat', 'Horse', 'Iguana', 'Jaguar', 'Kangaroo', 'Lion', 'Monkey', 'Narwhal', 'Ostrich', 'Penguin', 'Queen', 'Rat', 'Snake', 'Tiger', 'Unicorn', 'Vampire', 'Whale', 'XRay', 'Yak', 'Zebra'];
    let currentWord;

    function addLetter(letter) {
        const input = document.getElementById('spellingInput');
        input.value += letter;
    }

    function checkSpelling() {
    const input = document.getElementById('spellingInput');
    const userSpelling = input.value.trim().toLowerCase(); // Trim whitespace and convert to lowercase
    const answer = currentWord.toLowerCase();
    const messageElement = document.getElementById('message');

    if (userSpelling === answer) {
        messageElement.textContent = 'Correct! Next word coming...';
        messageElement.style.color = 'darkgreen';
        playSound(true); 
        console.log('That is correct');// Play sound for correct spelling
        setTimeout(() => {
            messageElement.textContent = '';
            document.getElementById('spellingInput').value = '';
            askQuestion();
        }, 1400);
    } else {
        messageElement.textContent = 'Incorrect. Try again.';
        messageElement.style.color = 'red';
        playSound(false); 
        console.log('That is Incorrect');// Play sound for incorrect spelling
    }
}
function clearLastLetter() {
        const input = document.getElementById('spellingInput');
        const currentText = input.value;
        input.value = currentText.substring(0, currentText.length - 1); // Remove the last character
    }
