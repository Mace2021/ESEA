<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Letters - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>ABC Letters</h1>
            <p>Tap a letter. Hear it, say it, and look for it around you.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        window.EarlyLesson = {
            title: 'Say Your ABCs',
            instructions: 'Tap one letter at a time. Say the big letter and little letter.',
            type: 'explore',
            sections: [{
                title: 'Letters',
                compact: true,
                items: letters.map(function(letter) {
                    return { label: letter + ' ' + letter.toLowerCase(), symbol: letter, speak: letter };
                })
            }]
        };
    </script>
    <script src="../early-lesson.js"></script>
</body>
</html>
