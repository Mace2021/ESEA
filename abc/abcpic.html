<!DOCTYPE html>

    <title>Letters with Pictures - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">

<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Letters with Pictures</h1>
            <p>Connect each letter to a simple picture word.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        window.EarlyLesson = {
            title: 'ABC Picture Words',
            instructions: 'Tap a picture to hear the letter and word.',
            type: 'explore',
            sections: [{
                title: 'Picture Alphabet',
                items: [
                    { label: 'A apple', image: '../images/apple.png', speak: 'A for apple' },
                    { label: 'B ball', image: '../images/Ball.png', speak: 'B for ball' },
                    { label: 'C cat', image: '../images/cat.png', speak: 'C for cat' },
