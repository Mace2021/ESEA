<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick the Letter - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
    <script src="../speech.js"></script>
    <script src="../family.js"></script>
    <script src="../pip.js"></script>
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Pick the Letter</h1>
            <p>Look at the letter, listen, and tap the match.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        function letterOption(letter) {
            return { value: letter, label: letter, symbol: letter };
        }
        function letterRound(letter, choices) {
            return {
                prompt: 'Tap letter ' + letter + '.',
                speak: 'Can you find the letter [' + letter + ']?',
                answer: letter,
                target: { text: letter },
                options: choices.map(letterOption)
            };
        }
        // Letters that are easy to mix up make the better wrong answers for older children.
        var LOOKALIKE = { b: 'dpq', d: 'bpq', p: 'qbd', q: 'pdb', m: 'nw', n: 'mu', u: 'nv', w: 'mv', c: 'oe', o: 'ca', e: 'ca',
            a: 'oe', f: 't', t: 'f', i: 'lj', l: 'i', j: 'i', g: 'q', h: 'n', k: 'x', r: 'n', s: 'z', z: 's', v: 'wy', y: 'v', x: 'k' };
        function confusers(letter, pool, count) {
            var lower = letter.toLowerCase();
            var picks = (LOOKALIKE[lower] || '').split('').filter(function(c) { return c && c !== lower; })
                .map(function(c) { return letter === lower ? c : c.toUpperCase(); });
            var rest = pool.filter(function(c) { return c !== letter && picks.indexOf(c) === -1; });
            for (var i = rest.length - 1; i > 0; i -= 1) { var j = Math.floor(Math.random() * (i + 1)); var t = rest[i]; rest[i] = rest[j]; rest[j] = t; }
            return picks.concat(rest).slice(0, count);
        }
        // Age decides the letters: 3 yrs eight common capitals, 4 yrs A-M, 5 yrs A-Z,
        // 6 yrs lowercase letters with look-alikes (b, d, p, q) as the other choices.
        var F = window.ESEAFamily;
        var CAPS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        var LETTERS = F ? F.byAge({ 3: 'ABCDEMOS'.split(''), 4: CAPS.slice(0, 13), 5: CAPS, 6: CAPS.map(function(c) { return c.toLowerCase(); }) }) : CAPS.slice(0, 13);
        window.EarlyLesson = {
            title: 'Find the Letter',
            instructions: 'Listen to the letter name, then tap that letter.',
            type: 'quiz',
            rounds: LETTERS.map(function(letter) {
                return letterRound(letter, [letter].concat(confusers(letter, LETTERS, 3)));
            })
        };
    </script>
    <script src="../skill-tracker.js"></script>
    <script src="../early-lesson.js"></script>
</body>
</html>
