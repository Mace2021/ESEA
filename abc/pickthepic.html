<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick the Picture - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Pick the Picture</h1>
            <p>Listen to the word and tap the matching picture.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        var pictures = [
            { value: 'apple', label: 'Apple', image: '../images/apple.png' },
            { value: 'banana', label: 'Banana', image: '../images/banana.png' },
            { value: 'cat', label: 'Cat', image: '../images/cat.png' },
            { value: 'dog', label: 'Dog', image: '../images/Dog.png' },
            { value: 'frog', label: 'Frog', image: '../images/Frog.png' },
            { value: 'rabbit', label: 'Rabbit', image: '../images/Rabbit.png' },
            { value: 'tiger', label: 'Tiger', image: '../images/Tiger.png' },
            { value: 'zebra', label: 'Zebra', image: '../images/Zebra.png' }
        ];
        function pictureRound(item, options) {
            return {
                prompt: 'Find: ' + item.label,
                speak: 'Find the picture of ' + item.label + '.',
                answer: item.value,
                target: { text: item.label },
                options: options
            };
        }
        window.EarlyLesson = {
            title: 'Word to Picture',
            instructions: 'This supports listening, vocabulary, and visual matching.',
            type: 'quiz',
            rounds: [
                pictureRound(pictures[0], [pictures[0], pictures[1], pictures[2], pictures[3]]),
                pictureRound(pictures[2], [pictures[2], pictures[4], pictures[5], pictures[6]]),
                pictureRound(pictures[3], [pictures[3], pictures[0], pictures[5], pictures[7]]),
                pictureRound(pictures[4], [pictures[4], pictures[1], pictures[2], pictures[7]]),
                pictureRound(pictures[7], [pictures[7], pictures[3], pictures[5], pictures[6]])
            ]
        };
    </script>
    <script src="../early-lesson.js"></script>
</body>
</html>
