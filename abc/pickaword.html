<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick the Word - ESEA</title>
    <link rel="stylesheet" href="../early-lesson.css">
</head>
<body>
    <div class="lesson-shell">
        <header class="lesson-hero">
            <img src="../images/ESEA.png" alt="ESEA logo">
            <h1>Pick the Word</h1>
            <p>Look at the picture and tap the matching word.</p>
        </header>
        <main class="lesson-main">
            <nav class="lesson-nav"><a class="home-button" href="../index.html">Home</a></nav>
            <section class="lesson-card-panel" id="lessonRoot"></section>
        </main>
        <footer><p>ESEA - Early Start Education App</p></footer>
    </div>
    <script>
        var wordBank = [
            { value: 'apple', label: 'Apple', image: '../images/apple.png' },
            { value: 'cat', label: 'Cat', image: '../images/cat.png' },
            { value: 'dog', label: 'Dog', image: '../images/Dog.png' },
            { value: 'fish', label: 'Fish', image: '../images/Fish.png' },
            { value: 'goat', label: 'Goat', image: '../images/Goat.png' },
            { value: 'horse', label: 'Horse', image: '../images/Horse.png' },
            { value: 'lion', label: 'Lion', image: '../images/Lion.png' },
            { value: 'monkey', label: 'Monkey', image: '../images/Monkey.png' }
        ];
        function wordRound(item, options) {
            return {
                prompt: 'Which word matches the picture?',
                speak: 'Which word is ' + item.label + '?',
                answer: item.value,
                target: { image: item.image, alt: item.label },
                options: options
            };
        }
        window.EarlyLesson = {
            title: 'Picture to Word',
            instructions: 'Use familiar words and clear pictures. Read the word together.',
            type: 'quiz',
            rounds: [
                wordRound(wordBank[0], [wordBank[0], wordBank[1], wordBank[2], wordBank[3]]),
                wordRound(wordBank[1], [wordBank[1], wordBank[4], wordBank[5], wordBank[6]]),
                wordRound(wordBank[2], [wordBank[2], wordBank[0], wordBank[6], wordBank[7]]),
                wordRound(wordBank[3], [wordBank[3], wordBank[1], wordBank[4], wordBank[7]]),
                wordRound(wordBank[6], [wordBank[6], wordBank[2], wordBank[3], wordBank[5]])
            ]
        };
    </script>
    <script src="../early-lesson.js"></script>
</body>
</html>
